      - run: Rscript language/r/Tutorial/fire-spread/fire.R --test

  r-property-forecast:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'r')
    runs-on: ubuntu-latest
