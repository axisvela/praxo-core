name: ci-examples-d

on:
  push:
    branches: [main]
    paths:
      - "language/d/**"
      - ".github/workflows/ci-examples-d.yml"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
  pull_request:
    paths:
      - "language/d/**"
      - ".github/workflows/ci-examples-d.yml"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-examples-d.yml
        run: python -m scripts.ci.ci_changes

  d-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'd')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/retry/retry.d
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'd')
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/checkpoint/checkpoint.d
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'd')
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/event-sink/event_sink.d
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'd')
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/provider-fallback/fallback.d
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'd')
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/structured-output/structured_output.d
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'd')
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/streaming/streaming.d
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'd')
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/identity-policy/identity_policy.d
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'd')
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/service/service.d
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'd')
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/mcp/mcp.d
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'd')
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/hitl/starter.d
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'd')
      - run: dmd -i -Ilanguage/d/source -Ilanguage/d/examples/hitl -version=HitlExampleTest -run language/d/examples/hitl/test_starter.d
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'd')
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/consumer/consumer.d
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'd')

