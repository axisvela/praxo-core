name: ci-elixir

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - "language/elixir/**"
      - ".github/workflows/ci-elixir.yml"
      - "!scripts/discovery/**"
      - "!scripts/checks/**"
      - "!scripts/release/**"
      - "!scripts/execution/**"
      - "!scripts/metrics/**"
      - "!scripts/validation/**"
      - "!scripts/ci/**"
      - "!scripts/labs/**"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
      - "!scripts/consumers/go/**"
      - "!scripts/consumers/java/**"
      - "!scripts/consumers/longrunning/**"
      - "!scripts/consumers/python/**"
      - "!scripts/consumers/typescript/**"
      - "!scripts/languages/ocaml/**"
      - "!scripts/languages/php/**"
  pull_request:
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - "language/elixir/**"
      - ".github/workflows/ci-elixir.yml"
      - "!scripts/discovery/**"
      - "!scripts/checks/**"
      - "!scripts/release/**"
      - "!scripts/execution/**"
      - "!scripts/metrics/**"
      - "!scripts/validation/**"
      - "!scripts/ci/**"
      - "!scripts/labs/**"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
      - "!scripts/consumers/go/**"
      - "!scripts/consumers/java/**"
      - "!scripts/consumers/longrunning/**"
      - "!scripts/consumers/python/**"
      - "!scripts/consumers/typescript/**"
      - "!scripts/languages/ocaml/**"
      - "!scripts/languages/php/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-elixir.yml
        run: python -m scripts.ci.ci_changes

  elixir-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'elixir')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
          install-hex: false
          install-rebar: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python language/elixir/api-snapshot.py --check
      - run: mkdir -p language/elixir/build/ebin
      - run: elixirc -o language/elixir/build/ebin language/elixir/lib/praxo/*.ex language/elixir/lib/praxo/adapters/*.ex
      - run: elixir -pa language/elixir/build/ebin language/elixir/tests/run_tests.exs
      - run: elixir -pa language/elixir/build/ebin language/elixir/conformance/run.exs
      - run: elixir -pa language/elixir/build/ebin language/elixir/examples/advanced-delegation/governance_test.exs
      - run: elixir -pa language/elixir/build/ebin language/elixir/examples/representative-chain/chain.exs

  current-elixir-consumer:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'elixir')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/elixir/examples/consumer
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
      - run: mix deps.get
      - run: mix run test_starter.exs

