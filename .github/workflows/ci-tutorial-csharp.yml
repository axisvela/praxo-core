name: ci-tutorial-csharp

on:
  push:
    branches: [main]
    paths:
      - "language/csharp/Tutorial/**"
      - ".github/workflows/ci-tutorial-csharp.yml"
  pull_request:
    paths:
      - "language/csharp/Tutorial/**"
      - ".github/workflows/ci-tutorial-csharp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-tutorial-csharp.yml
        run: python scripts/ci_changes.py

  csharp-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'csharp')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - { dir: internal-service-desk, assembly: InternalServiceDesk }
          - { dir: rpa-reconciliation, assembly: RpaReconciliation }
          - { dir: contract-review, assembly: ContractReview }
          - { dir: bom-review, assembly: BomReview }
          - { dir: trial-screening, assembly: TrialScreening }
          - { dir: phishing-awareness, assembly: PhishingAwareness }
          - { dir: zero-trust-review, assembly: ZeroTrustReview }
          - { dir: public-approval, assembly: PublicApproval }
          - { dir: due-diligence, assembly: DueDiligence }
          - { dir: construction-safety, assembly: ConstructionSafety }
          - { dir: architecture-graph, assembly: ArchitectureGraph }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - run: dotnet build -p:UseAppHost=false -v q
        working-directory: language/csharp/Tutorial/${{ matrix.dir }}
      - run: dotnet bin/Debug/net8.0/Praxo.${{ matrix.assembly }}.dll --test
        working-directory: language/csharp/Tutorial/${{ matrix.dir }}

  csharp-order-review:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'csharp')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build language/csharp/Tutorial/order-review/OrderReview.csproj --nologo
      - run: dotnet language/csharp/Tutorial/order-review/bin/Debug/net8.0/Praxo.OrderReview.dll --test

  csharp-test-generation:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'csharp')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build language/csharp/Tutorial/test-generation/TestGeneration.csproj --nologo
      - run: dotnet language/csharp/Tutorial/test-generation/bin/Debug/net8.0/Praxo.TestGeneration.dll --test

  csharp-airport-recovery:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'csharp')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build language/csharp/Tutorial/airport-recovery/AirportRecovery.csproj --nologo
      - run: dotnet language/csharp/Tutorial/airport-recovery/bin/Debug/net8.0/Praxo.AirportRecovery.dll --test

  csharp-medical-coding:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'csharp')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build language/csharp/Tutorial/medical-coding/MedicalCoding.csproj --nologo
      - run: dotnet language/csharp/Tutorial/medical-coding/bin/Debug/net8.0/Praxo.MedicalCoding.dll --test

  csharp-healthcare-scheduling:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'csharp')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build language/csharp/Tutorial/healthcare-scheduling/HealthcareScheduling.csproj --nologo
      - run: dotnet language/csharp/Tutorial/healthcare-scheduling/bin/Debug/net8.0/Praxo.HealthcareScheduling.dll --test

  csharp-sales-crm:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'csharp')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
