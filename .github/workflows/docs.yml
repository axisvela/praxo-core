name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "language/**/*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs_hooks.py"
      - "scripts/test_docs.py"
      - "scripts/test_roadmap.py"
      - "scripts/test_layout.py"
      - "scripts/check_adapter_status.py"
      - "scripts/test_adapter_status.py"
      - "scripts/sync_language_registry_docs.py"
      - "scripts/test_language_registry_docs.py"
      - "scripts/registry_catalog.py"
      - "scripts/registry_discovery.py"
      - "scripts/repository_discovery.py"
      - "scripts/test_discovery.py"
      - "scripts/mirror_readme.py"
      - "scripts/sync_language_mirrors.py"
      - "scripts/test_sync_language_mirrors.py"
      - "language/discovery.json"
      - "REGISTRY.md"
      - "llms.md"
      - "llms.txt"
      - "language/REGISTRY-INDEX.md"
      - "language/*/REGISTRY.md"
      - "language/*/llms.txt"
      - "language/*/llms.md"
      - "docs/languages/adapter-status.md"
      - "docs/reference/mcp-client.md"
      - "docs/reference/harmovela-sink.md"
      - "scripts/check_registry_state.py"
      - "scripts/test_registry_state.py"
      - "scripts/check_registry_pages.py"
      - "scripts/test_registry_pages.py"
      - "scripts/check_consumer_pins.py"
      - "scripts/test_consumer_pins.py"
      - "scripts/check_language_releases.py"
      - "scripts/test_language_releases.py"
      - "language/registry-metadata.json"
      - "language/*/CHANGELOG.md"
      - "language/*/VERSION"
      - "language/*/pyproject.toml"
      - "language/*/package.json"
      - "language/*/pom.xml"
      - "language/*/Cargo.toml"
      - "language/*/*.csproj"
      - "language/csharp/Praxo.Core/Praxo.Core.csproj"
      - "language/*/mix.exs"
      - "language/*/*.app.src"
      - "language/erlang/src/praxo_core.app.src"
      - "language/*/composer.json"
      - "language/*/*.rockspec"
      - "language/*/pubspec.yaml"
      - "language/*/Project.toml"
      - "language/*/DESCRIPTION"
      - "language/*/*.pm"
      - "language/*/*.cabal"
      - "language/*/*.nimble"
      - "language/*/v.mod"
      - "language/*/dub.json"
      - "language/*/*.gemspec"
      - "language/*/Makefile.PL"
      - "language/powershell/praxo-core-ps/*.psd1"
      - "language/*/README.pod"
      - "docs/languages/registry-status.md"
      - "docs/languages/registry-pages.md"
      - "docs/getting-started/agent-integration.json"
      - "language/go/examples/consumer-go/**"
      - "language/python/examples/consumer/**"
      - "language/typescript/examples/consumer/**"
      - "language/java/examples/consumer/**"
      - "language/ruby/examples/consumer/**"
      - "language/php/examples/consumer/**"
      - "language/elixir/examples/consumer/**"
      - "language/lua/examples/consumer/**"
      - "**/README*.md"
      - "VERSION"
      - "CHANGELOG*.md"
      - "ROADMAP*.md"
      - "scripts/verify_release_checks.py"
      - "scripts/test_release_checks.py"
      - "scripts/release_manifest.py"
      - "scripts/test_release_manifest.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/language-source-release.yml"
      - ".github/workflows/python-release.yml"
      - ".github/workflows/typescript-release.yml"
      - "spec/languages.md"
      - "spec/SPEC_VERSION"
      - ".github/workflows/docs.yml"
      - ".github/workflows/ci.yml"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - run: python scripts/check_registry_state.py
      - run: python scripts/check_registry_pages.py
      - run: python scripts/check_consumer_pins.py
      - run: python scripts/check_language_releases.py --no-tags
      - run: python scripts/test_discovery.py -v
      - run: python scripts/sync_language_registry_docs.py --check
      - run: python scripts/repository_discovery.py --check
      - name: Run documentation and metadata tests
        working-directory: scripts
        run: >-
          python -m unittest -v test_docs test_roadmap test_layout test_adapter_status
          test_language_registry_docs test_discovery test_registry_state test_registry_pages
          test_consumer_pins test_language_releases test_sync_language_mirrors
          test_release_checks test_release_manifest test_ci_changes test_ci_execution
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
