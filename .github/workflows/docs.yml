name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs_hooks.py"
      - "scripts/test_docs.py"
      - "scripts/test_layout.py"
      - "**/README*.md"
      - "VERSION"
      - "CHANGELOG*.md"
      - "ROADMAP*.md"
      - "scripts/verify_release_checks.py"
      - "scripts/test_release_checks.py"
      - "scripts/release_manifest.py"
      - "scripts/test_release_manifest.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/python-release.yml"
      - ".github/workflows/typescript-release.yml"
      - "spec/languages.md"
      - "spec/SPEC_VERSION"
      - ".github/workflows/docs.yml"
      - ".github/workflows/ci.yml"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - run: python -m unittest discover -s scripts -p "test_*.py" -v
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
