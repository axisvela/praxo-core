name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "scripts/discovery/**"
      - "scripts/checks/**"
      - "scripts/release/**"
      - "scripts/execution/**"
      - "scripts/validation/**"
      - "language/**/*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "language/discovery.json"
      - "REGISTRY.md"
      - "llms.md"
      - "llms.txt"
      - "language/REGISTRY-INDEX.md"
      - "language/*/REGISTRY.md"
      - "language/*/llms.txt"
      - "language/*/llms.md"
      - "docs/languages/adapter-status.md"
      - "docs/reference/mcp-client.md"
      - "docs/reference/harmovela-sink.md"
      - "language/registry-metadata.json"
      - "language/*/CHANGELOG.md"
      - "language/*/VERSION"
      - "language/*/pyproject.toml"
      - "language/*/package.json"
      - "language/*/pom.xml"
      - "language/*/Cargo.toml"
      - "language/*/*.csproj"
      - "language/csharp/Praxo.Core/Praxo.Core.csproj"
      - "language/*/mix.exs"
      - "language/*/*.app.src"
      - "language/erlang/src/praxo_core.app.src"
      - "language/*/composer.json"
      - "language/*/*.rockspec"
      - "language/*/pubspec.yaml"
      - "language/*/Project.toml"
      - "language/*/DESCRIPTION"
      - "language/*/*.pm"
      - "language/*/*.cabal"
      - "language/*/*.nimble"
      - "language/*/v.mod"
      - "language/*/dub.json"
      - "language/*/*.gemspec"
      - "language/*/Makefile.PL"
      - "language/powershell/praxo-core-ps/*.psd1"
      - "language/*/README.pod"
      - "docs/languages/registry-status.md"
      - "docs/languages/registry-pages.md"
      - "docs/getting-started/agent-integration.json"
      - "language/go/examples/consumer-go/**"
      - "language/python/examples/consumer/**"
      - "language/typescript/examples/consumer/**"
      - "language/java/examples/consumer/**"
      - "language/ruby/examples/consumer/**"
      - "language/php/examples/consumer/**"
      - "language/elixir/examples/consumer/**"
      - "language/lua/examples/consumer/**"
      - "**/README*.md"
      - "VERSION"
      - "CHANGELOG*.md"
      - "ROADMAP*.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/language-source-release.yml"
      - ".github/workflows/python-release.yml"
      - ".github/workflows/typescript-release.yml"
      - "spec/languages.md"
      - "spec/SPEC_VERSION"
      - ".github/workflows/docs.yml"
      - ".github/workflows/ci.yml"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - run: python -m scripts.checks.check_registry_state
      - run: python -m scripts.checks.check_registry_pages
      - run: python -m scripts.checks.check_consumer_pins
      - run: python -m scripts.checks.check_language_releases --no-tags
      - run: python -m scripts.discovery.test_discovery -v
      - run: python -m scripts.discovery.sync_language_registry_docs --check
      - run: python -m scripts.discovery.repository_discovery --check
      - name: Run documentation and metadata tests
        run: >-
          python -m unittest -v scripts.validation.test_docs scripts.validation.test_roadmap
          scripts.validation.test_layout scripts.checks.test_adapter_status
          scripts.discovery.test_language_registry_docs scripts.discovery.test_discovery
          scripts.checks.test_registry_state scripts.checks.test_registry_pages
          scripts.checks.test_consumer_pins scripts.checks.test_language_releases
          scripts.discovery.test_sync_language_mirrors scripts.release.test_release_checks
          scripts.release.test_release_manifest scripts.ci.test_ci_changes scripts.ci.test_ci_execution
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
