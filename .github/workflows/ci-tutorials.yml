name: ci-tutorials

on:
  push:
    branches: [main]
    paths:
      - 'language/*/Tutorial/**'
      - '.github/workflows/ci-tutorials.yml'
  pull_request:
    paths:
      - 'language/*/Tutorial/**'
      - '.github/workflows/ci-tutorials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csharp-order-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build language/csharp/Tutorial/order-review/OrderReview.csproj --nologo
      - run: dotnet language/csharp/Tutorial/order-review/bin/Debug/net8.0/Praxo.OrderReview.dll --test

  powershell-windows-diagnostics:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build language/csharp/Praxo.Core/Praxo.Core.csproj -c Debug --nologo
      - run: pwsh -NoProfile -File language/powershell/Tutorial/windows-diagnostics/tests.ps1 -SourceMode -IncludeLocalMachine

  perl-log-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: perl language/perl/Tutorial/log-triage/triage.pl --test

  r-data-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - run: Rscript language/r/Tutorial/data-quality/data_quality.R --test

  cobol-batch-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gnucobol
      - run: python language/cobol/Tutorial/batch-exception-review/run.py

  java-order-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -q test
        working-directory: language/java/Tutorial/order-review

  shared-service-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: axisvela/agent-tutorial-services
          ref: cd08b095982af3596d2e86597f97d5df02af3c52
          path: tutorial-services
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build language/csharp/Tutorial/order-review/OrderReview.csproj --nologo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -q test
        working-directory: language/java/Tutorial/order-review
      - run: mvn -B -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DincludeScope=runtime
        working-directory: language/java/Tutorial/order-review
      - run: python -m pip install --target tutorial-packages -r language/python/Tutorial/order-review/requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: language/typescript/Tutorial/order-review
      - run: python -m unittest discover -s tutorial-services/tests -v
        env:
          PRAXO_CORE_REPO: ${{ github.workspace }}
          PRAXO_PYTHON_PACKAGE_PATH: ${{ github.workspace }}/tutorial-packages
          PRAXO_JAVA_CLASSPATH: ${{ github.workspace }}/language/java/Tutorial/order-review/target/classes:${{ github.workspace }}/language/java/Tutorial/order-review/target/dependency/*
          PRAXO_DOTNET_DLL: ${{ github.workspace }}/language/csharp/Tutorial/order-review/bin/Debug/net8.0/Praxo.OrderReview.dll
