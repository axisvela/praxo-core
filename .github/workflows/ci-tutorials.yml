name: ci-tutorials

on:
  push:
    branches: [main]
    paths:
      - 'language/*/Tutorial/**'
      - '.github/workflows/ci-tutorials.yml'
  pull_request:
    paths:
      - 'language/*/Tutorial/**'
      - '.github/workflows/ci-tutorials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csharp-order-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build language/csharp/Tutorial/order-review/OrderReview.csproj --nologo
      - run: dotnet language/csharp/Tutorial/order-review/bin/Debug/net8.0/Praxo.OrderReview.dll --test

  powershell-windows-diagnostics:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build language/csharp/Praxo.Core/Praxo.Core.csproj -c Debug --nologo
      - run: pwsh -NoProfile -File language/powershell/Tutorial/windows-diagnostics/tests.ps1 -SourceMode -IncludeLocalMachine

  perl-log-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: perl language/perl/Tutorial/log-triage/triage.pl --test

  r-data-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - run: Rscript language/r/Tutorial/data-quality/data_quality.R --test

  typescript-customer-support:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: language/typescript/Tutorial/customer-support
      - run: npm test
        working-directory: language/typescript/Tutorial/customer-support

  java-wealth-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -q test
        working-directory: language/java/Tutorial/wealth-service

  lua-host-embedding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 language/lua/Tutorial/host-embedding/app.lua --test

  rust-iot-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --quiet --locked -- --test
        working-directory: language/rust/Tutorial/iot-gateway

  zig-gateway-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"
      - run: mkdir -p build
      - run: zig build-exe --dep praxo -Mroot=language/zig/Tutorial/gateway-health/main.zig -Mpraxo=language/zig/src/praxo.zig -femit-bin=build/praxo-zig-gateway
      - run: ./build/praxo-zig-gateway --test

  c-device-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S language/c -B language/c/build
      - run: cmake --build language/c/build --target praxo-c-device-diagnostics-tutorial
      - run: ./language/c/build/praxo-c-device-diagnostics-tutorial --test

  cpp-industrial-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S language/cpp -B language/cpp/build
      - run: cmake --build language/cpp/build --target praxo-cpp-industrial-edge-tutorial
      - run: ./language/cpp/build/praxo-cpp-industrial-edge-tutorial --test

  go-incident-coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go run ./language/go/Tutorial/incident-coordination --test
      - run: go test ./language/go/Tutorial/incident-coordination

  fortran-simulation-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gfortran g++ cmake ninja-build
      - run: python3 language/fortran/run-tests.py --re2-only
      - run: python language/fortran/Tutorial/simulation-metrics/run.py

  python-office-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --target tutorial-packages -r language/python/Tutorial/office-qa/requirements.txt
      - run: PYTHONPATH=tutorial-packages python language/python/Tutorial/office-qa/app.py --test

  cobol-batch-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gnucobol
      - run: python language/cobol/Tutorial/batch-exception-review/run.py

  julia-experiment-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - run: julia --project=language/julia -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=language/julia language/julia/Tutorial/experiment-comparison/experiment_comparison.jl --test

  octave-signal-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y octave
      - run: octave --no-gui --quiet language/octave/Tutorial/signal-trends/run.m

  csharp-sales-crm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build language/csharp/Tutorial/sales-crm/SalesCrm.csproj --nologo
      - run: dotnet language/csharp/Tutorial/sales-crm/bin/Debug/net8.0/Praxo.SalesCrm.dll --test

  java-order-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -q test
        working-directory: language/java/Tutorial/order-review

  shared-service-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: axisvela/agent-tutorial-services
          ref: cd08b095982af3596d2e86597f97d5df02af3c52
          path: tutorial-services
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build language/csharp/Tutorial/order-review/OrderReview.csproj --nologo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -q test
        working-directory: language/java/Tutorial/order-review
      - run: mvn -B -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DincludeScope=runtime
        working-directory: language/java/Tutorial/order-review
      - run: python -m pip install --target tutorial-packages -r language/python/Tutorial/order-review/requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: language/typescript/Tutorial/order-review
      - run: python -m unittest discover -s tutorial-services/tests -v
        env:
          PRAXO_CORE_REPO: ${{ github.workspace }}
          PRAXO_PYTHON_PACKAGE_PATH: ${{ github.workspace }}/tutorial-packages
          PRAXO_JAVA_CLASSPATH: ${{ github.workspace }}/language/java/Tutorial/order-review/target/classes:${{ github.workspace }}/language/java/Tutorial/order-review/target/dependency/*
          PRAXO_DOTNET_DLL: ${{ github.workspace }}/language/csharp/Tutorial/order-review/bin/Debug/net8.0/Praxo.OrderReview.dll
