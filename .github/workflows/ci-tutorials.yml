name: ci-tutorials

on:
  push:
    branches: [main]
    paths:
      - "language/*/Tutorial/**"
      - "docs/**/agent-scenarios.md"
      - "docs/**/tutorial-catalog.md"
      - "docs/**/tutorial-plan.md"
      - "mkdocs.yml"
      - ".github/workflows/ci-tutorials.yml"
  pull_request:
    paths:
      - "language/*/Tutorial/**"
      - "docs/**/agent-scenarios.md"
      - "docs/**/tutorial-catalog.md"
      - "docs/**/tutorial-plan.md"
      - "mkdocs.yml"
      - ".github/workflows/ci-tutorials.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-tutorials.yml
        run: python scripts/ci_changes.py

  scenario-catalog:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.examples == 'true' || needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_agent_scenarios.py
      - run: python scripts/tutorial_catalog.py --check
      - run: python scripts/test_tutorial_catalog.py
      - run: python scripts/check_example_coverage.py
      - run: python scripts/test_example_coverage.py -q

  objc-privacy-agent:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'c') || contains(fromJSON(needs.changes.outputs.tutorials), 'objc')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p build
      - run: cmake -S language/c -B language/c/build
      - run: cmake --build language/c/build
      - run: >-
          clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-privacy
          language/objc/Tutorial/privacy-agent/privacy.m
          language/objc/src/PraxoJSON.m language/objc/src/PraxoJsonSchema.m
          language/objc/src/PraxoPlugin.m language/objc/src/PraxoWire.m
          language/objc/src/PraxoCore.m language/objc/src/PraxoAgent.m
          language/objc/src/PraxoHitl.m language/objc/src/PraxoOpenAI.m
          language/objc/src/PraxoAnthropic.m language/objc/src/PraxoGemini.m
          language/objc/src/PraxoHarmovela.m language/objc/src/PraxoMCP.m
          language/objc/src/PraxoOtel.m language/objc/src/PraxoRetriever.m
          language/objc/src/PraxoDelegation.m language/objc/src/PraxoPluginProcess.m
          -Ilanguage/c/include -Llanguage/c/build -lpraxo_core -framework Foundation
      - run: ./build/objc-privacy --test

  delphi-legacy-migration:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'delphi')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fpc
      - run: mkdir -p language/delphi/build
      - run: fpc -Mobjfpc -Scghi -O2 -Fu. -FEbuild Tutorial/legacy-migration/inventory.pas
        working-directory: language/delphi
      - run: ./build/inventory --test
        working-directory: language/delphi

  ocaml-code-review:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'ocaml')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14'
      - run: opam exec -- ocaml unix.cma review.ml --test
        working-directory: language/ocaml/Tutorial/code-review

  erlang-aiops-rca:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'erlang')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          install-hex: false
          install-rebar: false
      - run: mkdir -p language/erlang/build/ebin
      - run: erlc -I language/erlang/src -o language/erlang/build/ebin language/erlang/src/*.erl
      - run: escript language/erlang/Tutorial/aiops-rca/rca.escript --test

  elixir-knowledge-maintenance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'elixir')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20.4'
          install-hex: false
          install-rebar: false
      - run: mkdir -p language/elixir/build/ebin
      - run: elixirc -o language/elixir/build/ebin language/elixir/lib/praxo/*.ex language/elixir/lib/praxo/adapters/*.ex
      - run: elixir -pa language/elixir/build/ebin language/elixir/Tutorial/knowledge-maintenance/app.exs --test

  v-production-scheduling:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/vlang/v /tmp/v
      - run: make -C /tmp/v
      - run: /tmp/v/v -path "language/v|@vlib|@vmodules" -o build/v-schedule language/v/Tutorial/production-scheduling/schedule.v
      - run: ./build/v-schedule --test

  d-executive-brief:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'd')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - run: dmd -i -Ilanguage/d/source -run language/d/Tutorial/executive-brief/brief.d --test

  nim-maintenance-triage:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'nim')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'
      - run: nim c --path:language/nim/src --hints:off --out:build/nim-maintenance language/nim/Tutorial/maintenance-triage/maintenance.nim
      - run: ./build/nim-maintenance --test

  haskell-literature-review:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'haskell')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.2'
      - run: runghc -ilanguage/haskell/src language/haskell/Tutorial/literature-review/app.hs --test

  dart-onboarding-plan:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'dart')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart language/dart/Tutorial/onboarding-plan/onboarding.dart --test

  dart-meeting-coordination:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'dart')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart language/dart/Tutorial/meeting-coordination/meeting.dart --test

  php-internal-service-desk:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'php')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - run: php language/php/Tutorial/internal-service-desk/app.php --test

  delphi-rpa-reconciliation:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'delphi')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fpc
      - run: mkdir -p language/delphi/build
      - run: fpc -Mobjfpc -Scghi -O2 -Fu. -FEbuild Tutorial/rpa-reconciliation/reconcile.pas
        working-directory: language/delphi
      - run: ./build/reconcile --test
        working-directory: language/delphi

  php-api-orchestration:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'php')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - run: php language/php/Tutorial/api-orchestration/app.php --test

  d-quant-risk:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'd')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - run: dmd -i -Ilanguage/d/source -run language/d/Tutorial/quant-risk/risk.d --test

  elixir-aiops-rca:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'elixir')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.18'
          install-hex: false
          install-rebar: false
      - run: mkdir -p language/elixir/build/ebin
      - run: elixirc -o language/elixir/build/ebin language/elixir/lib/praxo/*.ex language/elixir/lib/praxo/adapters/*.ex
      - run: elixir -pa language/elixir/build/ebin language/elixir/Tutorial/aiops-rca/app.exs --test

  elixir-soc-correlation:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'elixir')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.18'
          install-hex: false
          install-rebar: false
      - run: mkdir -p language/elixir/build/ebin
      - run: elixirc -o language/elixir/build/ebin language/elixir/lib/praxo/*.ex language/elixir/lib/praxo/adapters/*.ex
      - run: elixir -pa language/elixir/build/ebin language/elixir/Tutorial/soc-correlation/app.exs --test

  elixir-community-governance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'elixir')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.18'
          install-hex: false
          install-rebar: false
      - run: mkdir -p language/elixir/build/ebin
      - run: elixirc -o language/elixir/build/ebin language/elixir/lib/praxo/*.ex language/elixir/lib/praxo/adapters/*.ex
      - run: elixir -pa language/elixir/build/ebin language/elixir/Tutorial/community-governance/app.exs --test

  php-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'php')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        tutorial: [recruiting-match, customer-support, retail-replenishment]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: php language/php/Tutorial/${{ matrix.tutorial }}/app.php --test

  cobol-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'cobol')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        tutorial: [legacy-migration, medical-coding, budget-review]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gnucobol
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python language/cobol/Tutorial/${{ matrix.tutorial }}/run.py

  objc-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'c') || contains(fromJSON(needs.changes.outputs.tutorials), 'objc')
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      matrix:
        tutorial: [chronic-care, dlp-redaction, digital-twin-memory]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S language/c -B language/c/build && cmake --build language/c/build
      - run: mkdir -p build
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/${{ matrix.tutorial }} language/objc/Tutorial/${{ matrix.tutorial }}/*.m language/objc/src/*.m -Ilanguage/c/include -Llanguage/c/build -lpraxo_core -framework Foundation
      - run: ./build/${{ matrix.tutorial }} --test

  nim-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'nim')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - { dir: irrigation-plan, src: irrigation }
          - { dir: leak-localization, src: leak }
          - { dir: cold-chain, src: coldchain }
          - { dir: livestock-monitor, src: livestock }
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'
      - run: nim check --path:language/nim/src --hints:off language/nim/Tutorial/${{ matrix.dir }}/${{ matrix.src }}.nim

  r-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'r')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - { dir: executive-brief, src: executive_brief }
          - { dir: compliance-tracking, src: compliance_tracking }
          - { dir: clinical-guidelines, src: clinical_guidelines }
          - { dir: pollution-tracing, src: pollution_tracing }
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - run: Rscript language/r/Tutorial/${{ matrix.dir }}/${{ matrix.src }}.R --test

  python-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'python')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        tutorial: [marketing-segments, literature-review, pentest-lab-review, threat-hunting, audiobook-production, litigation-timeline, negotiation-interpretation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=language/python python language/python/Tutorial/${{ matrix.tutorial }}/app.py --test

  typescript-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'typescript')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        tutorial: [meeting-coordination, sales-crm, education-tutoring, phishing-awareness, storyboard-previs, live-show, copyright-evidence]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: language/typescript/Tutorial/${{ matrix.tutorial }}
      - run: npm test
        working-directory: language/typescript/Tutorial/${{ matrix.tutorial }}

  c-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'c')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        tutorial: [lab-loop, npc-narrative, world-economy, hvac-settings, livestock-monitor, aquaculture-water]
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p build
      - run: cmake -S language/c -B language/c/build && cmake --build language/c/build
      - run: cc -std=c11 -Ilanguage/c/include language/c/Tutorial/${{ matrix.tutorial }}/main.c -Llanguage/c/build -lpraxo_core -lm -o build/${{ matrix.tutorial }}
      - run: ./build/${{ matrix.tutorial }} --test

  fortran-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'fortran')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        tutorial: [weather-anomaly, dispatch-review, leak-localization, pollution-tracing, ocean-routing, fire-spread, mesh-review, mining-slope, eda-placement]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python language/fortran/Tutorial/${{ matrix.tutorial }}/run.py

  rust-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'rust')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        tutorial: [bug-repair, code-review, quant-risk, privacy-agent, pentest-lab-review, threat-hunting, dlp-redaction, supply-chain-review, drone-fleet-plan, fleet-map, copyright-evidence, biodiversity-alerts]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --quiet --locked -- --test
        working-directory: language/rust/Tutorial/${{ matrix.tutorial }}

  julia-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'julia')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { dir: churn-warning, file: churn_warning }
          - { dir: wealth-analysis, file: wealth_analysis }
          - { dir: molecule-screen, file: molecule_screen }
          - { dir: lab-loop, file: lab_loop }
          - { dir: materials-design, file: materials_design }
          - { dir: traffic-signal-plan, file: traffic_signal_plan }
          - { dir: emergency-route-plan, file: emergency_route_plan }
          - { dir: waste-collection, file: waste_collection }
          - { dir: ocean-routing, file: ocean_routing }
          - { dir: airport-recovery, file: airport_recovery }
          - { dir: mesh-review, file: mesh_review }
          - { dir: hvac-settings, file: hvac_settings }
          - { dir: fire-spread, file: fire_spread }
          - { dir: hedge-plan, file: hedge_plan }
          - { dir: policy-simulation, file: policy_simulation }
          - { dir: eda-placement, file: eda_placement }
          - { dir: virtual-pi, file: virtual_pi }
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - run: julia --project=language/julia -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=language/julia language/julia/Tutorial/${{ matrix.dir }}/${{ matrix.file }}.jl --test

  java-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'java')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        tutorial: [legacy-migration, test-generation, api-orchestration, rpa-reconciliation, credit-diligence, tax-review, supply-disruption, clinical-guidelines, trial-screening, medical-coding, zero-trust-review, public-approval, budget-review, container-yard, customs-reroute, airport-recovery, patent-fto, due-diligence, precedent-outline, tender-review, architecture-graph]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -q test
        working-directory: language/java/Tutorial/${{ matrix.tutorial }}

  cpp-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'cpp')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        tutorial: [quant-risk, production-scheduling, bom-review, household-robot, drone-fleet-plan, fleet-map, storyboard-previs, dubbing-plan, construction-safety, mining-slope]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S language/cpp -B language/cpp/build
      - run: cmake --build language/cpp/build --target praxo-cpp-${{ matrix.tutorial }}-tutorial
      - run: ./language/cpp/build/praxo-cpp-${{ matrix.tutorial }}-tutorial --test

  csharp-new-tutorials:
    needs: changes
