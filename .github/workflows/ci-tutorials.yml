name: ci-tutorials

on:
  push:
    branches: [main]
    paths:
      - "language/*/Tutorial/**"
      - "docs/**/agent-scenarios.md"
      - "docs/**/tutorial-catalog.md"
      - "docs/**/tutorial-plan.md"
      - "mkdocs.yml"
      - ".github/workflows/ci-tutorials.yml"
  pull_request:
    paths:
      - "language/*/Tutorial/**"
      - "docs/**/agent-scenarios.md"
      - "docs/**/tutorial-catalog.md"
      - "docs/**/tutorial-plan.md"
      - "mkdocs.yml"
      - ".github/workflows/ci-tutorials.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-tutorials.yml
        run: python -m scripts.ci.ci_changes

  scenario-catalog:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.examples == 'true' || needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.validation.test_agent_scenarios
      - run: python -m scripts.discovery.tutorial_catalog --check
      - run: python -m scripts.discovery.test_tutorial_catalog
      - run: python -m scripts.checks.check_example_coverage
      - run: python -m scripts.checks.test_example_coverage -q

  shared-service-integrations:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: axisvela/agent-tutorial-services
          ref: cd08b095982af3596d2e86597f97d5df02af3c52
          path: tutorial-services
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build language/csharp/Tutorial/order-review/OrderReview.csproj --nologo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -q test
        working-directory: language/java/Tutorial/order-review
      - run: mvn -B -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DincludeScope=runtime
        working-directory: language/java/Tutorial/order-review
      - run: python -m pip install --target tutorial-packages -r language/python/Tutorial/order-review/requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: language/typescript/Tutorial/order-review
      - run: python -m unittest discover -s tutorial-services/tests -v
        env:
          PRAXO_CORE_REPO: ${{ github.workspace }}
          PRAXO_PYTHON_PACKAGE_PATH: ${{ github.workspace }}/tutorial-packages
          PRAXO_JAVA_CLASSPATH: ${{ github.workspace }}/language/java/Tutorial/order-review/target/classes:${{ github.workspace }}/language/java/Tutorial/order-review/target/dependency/*
          PRAXO_DOTNET_DLL: ${{ github.workspace }}/language/csharp/Tutorial/order-review/bin/Debug/net8.0/Praxo.OrderReview.dll
