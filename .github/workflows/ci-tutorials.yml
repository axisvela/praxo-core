name: ci-tutorials

on:
  push:
    branches: [main]
    paths:
      - 'language/*/Tutorial/**'
      - 'language/ruby/lib/**'
      - 'docs/**/agent-scenarios.md'
      - 'scripts/test_agent_scenarios.py'
      - 'scripts/*tutorial_catalog.py'
      - 'scripts/check_example_coverage.py'
      - 'docs/**/tutorial-catalog.md'
      - 'docs/**/tutorial-plan.md'
      - 'language/*/examples/**'
      - 'examples/**'
      - 'mkdocs.yml'
      - '.github/workflows/ci-tutorials.yml'
  pull_request:
    paths:
      - 'language/*/Tutorial/**'
      - 'language/ruby/lib/**'
      - 'docs/**/agent-scenarios.md'
      - 'scripts/test_agent_scenarios.py'
      - 'scripts/*tutorial_catalog.py'
      - 'scripts/check_example_coverage.py'
      - 'docs/**/tutorial-catalog.md'
      - 'docs/**/tutorial-plan.md'
      - 'language/*/examples/**'
      - 'examples/**'
      - 'mkdocs.yml'
      - '.github/workflows/ci-tutorials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_agent_scenarios.py
      - run: python scripts/tutorial_catalog.py --check
      - run: python scripts/test_tutorial_catalog.py

  objc-privacy-agent:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p build
      - run: cmake -S language/c -B language/c/build
      - run: cmake --build language/c/build
      - run: >-
          clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-privacy
          language/objc/Tutorial/privacy-agent/privacy.m
          language/objc/src/PraxoJSON.m language/objc/src/PraxoJsonSchema.m
          language/objc/src/PraxoPlugin.m language/objc/src/PraxoWire.m
          language/objc/src/PraxoCore.m language/objc/src/PraxoAgent.m
          language/objc/src/PraxoHitl.m language/objc/src/PraxoOpenAI.m
          language/objc/src/PraxoAnthropic.m language/objc/src/PraxoGemini.m
          language/objc/src/PraxoHarmovela.m language/objc/src/PraxoMCP.m
          language/objc/src/PraxoOtel.m language/objc/src/PraxoRetriever.m
          language/objc/src/PraxoDelegation.m language/objc/src/PraxoPluginProcess.m
          -Ilanguage/c/include -Llanguage/c/build -lpraxo_core -framework Foundation
      - run: ./build/objc-privacy --test

  delphi-legacy-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fpc
      - run: fpc -Mobjfpc -Scghi -O2 -Fu. -FEbuild Tutorial/legacy-migration/inventory.pas
        working-directory: language/delphi
      - run: ./build/inventory --test
        working-directory: language/delphi

  ocaml-code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14'
      - run: ocaml unix.cma review.ml --test
        working-directory: language/ocaml/Tutorial/code-review

  erlang-aiops-rca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          install-hex: false
          install-rebar: false
      - run: mkdir -p language/erlang/build/ebin
      - run: erlc -I language/erlang/src -o language/erlang/build/ebin language/erlang/src/*.erl
      - run: escript language/erlang/Tutorial/aiops-rca/rca.escript --test

  elixir-knowledge-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20.4'
          install-hex: false
          install-rebar: false
      - run: mkdir -p language/elixir/build/ebin
      - run: elixirc -o language/elixir/build/ebin language/elixir/lib/praxo/*.ex language/elixir/lib/praxo/adapters/*.ex
      - run: elixir -pa language/elixir/build/ebin language/elixir/Tutorial/knowledge-maintenance/app.exs --test

  v-production-scheduling:
