      - "!scripts/sync_language_registry_docs.py"
      - "!scripts/test_adapter_status.py"
      - "!scripts/test_consumer_pins.py"
      - "!scripts/test_discovery.py"
      - "!scripts/test_docs.py"
      - "!scripts/test_language_registry_docs.py"
      - "!scripts/test_language_releases.py"
      - "!scripts/test_layout.py"
      - "!scripts/test_registry_pages.py"
      - "!scripts/test_registry_state.py"
      - "!scripts/test_roadmap.py"
      - "!scripts/test_sync_language_mirrors.py"
      - "!scripts/check_ci_workflow_coverage.py"
      - "!scripts/ci_changes.py"
      - "!scripts/sync_ci_routing.py"
      - "!scripts/test_ci_changes.py"
      - "!scripts/test_ci_execution.py"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
      - "!scripts/build_php_package.py"
      - "!scripts/test_php_package.py"
  pull_request:
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - "language/csharp/**"
      - "language/matlab/**"
      - "language/matlab-octave-core/**"
      - "language/powershell/**"
      - "global.json"
      - ".github/workflows/ci-additional2.yml"
      - "!scripts/check_adapter_status.py"
      - "!scripts/check_consumer_pins.py"
      - "!scripts/check_language_releases.py"
      - "!scripts/check_registry_pages.py"
      - "!scripts/check_registry_state.py"
      - "!scripts/docs_hooks.py"
      - "!scripts/mirror_readme.py"
      - "!scripts/registry_catalog.py"
      - "!scripts/registry_discovery.py"
      - "!scripts/repository_discovery.py"
      - "!scripts/sync_language_mirrors.py"
      - "!scripts/sync_language_registry_docs.py"
      - "!scripts/test_adapter_status.py"
      - "!scripts/test_consumer_pins.py"
      - "!scripts/test_discovery.py"
      - "!scripts/test_docs.py"
      - "!scripts/test_language_registry_docs.py"
      - "!scripts/test_language_releases.py"
      - "!scripts/test_layout.py"
      - "!scripts/test_registry_pages.py"
      - "!scripts/test_registry_state.py"
      - "!scripts/test_roadmap.py"
      - "!scripts/test_sync_language_mirrors.py"
      - "!scripts/check_ci_workflow_coverage.py"
      - "!scripts/ci_changes.py"
      - "!scripts/sync_ci_routing.py"
      - "!scripts/test_ci_changes.py"
      - "!scripts/test_ci_execution.py"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
      - "!scripts/build_php_package.py"
      - "!scripts/test_php_package.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-additional2.yml
        run: python scripts/ci_changes.py

  powershell-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'csharp') || contains(fromJSON(needs.changes.outputs.languages), 'powershell')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build language/csharp/Praxo.Core/Praxo.Core.csproj -c Release
      - run: pwsh -NoProfile -File language/powershell/examples/retry/retry.ps1
      - run: pwsh -NoProfile -File language/powershell/examples/checkpoint/checkpoint.ps1
      - run: pwsh -NoProfile -File language/powershell/examples/event-sink/event_sink.ps1
      - run: pwsh -NoProfile -File language/powershell/examples/provider-fallback/fallback.ps1
      - run: pwsh -NoProfile -File language/powershell/examples/structured-output/structured_output.ps1
      - run: pwsh -NoProfile -File language/powershell/examples/streaming/streaming.ps1
      - run: pwsh -NoProfile -File language/powershell/examples/identity-policy/identity_policy.ps1
      - run: pwsh -NoProfile -File language/powershell/examples/service/service.ps1
      - run: pwsh -NoProfile -File language/powershell/examples/mcp/mcp.ps1
      - run: pwsh -NoProfile -File language/powershell/examples/session-checkpoint/session_checkpoint.ps1
      - run: pwsh -NoProfile -File language/powershell/examples/hitl/hitl.ps1

  matlab-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'matlab') || contains(fromJSON(needs.changes.outputs.languages), 'matlab-octave-core')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y octave
      - run: octave --no-gui --quiet --path language/matlab/examples/retry --eval retry_example
      - run: octave --no-gui --quiet --path language/matlab-octave-core --path language/matlab/examples/checkpoint --eval checkpoint_example
      - run: octave --no-gui --quiet --path language/matlab-octave-core --path language/matlab/examples/event-sink --eval event_sink_example
      - run: octave --no-gui --quiet --path language/matlab/examples/provider-fallback --eval fallback_example
      - run: octave --no-gui --quiet --path language/matlab-octave-core --path language/matlab/examples/structured-output --eval structured_output_example
      - run: octave --no-gui --quiet --path language/matlab/examples/streaming --eval streaming_example
      - run: octave --no-gui --quiet --path language/matlab/examples/identity-policy --eval identity_policy_example
      - run: octave --no-gui --quiet --path language/matlab/examples/service --eval service_example
      - run: octave --no-gui --quiet --path language/matlab/examples/mcp --eval mcp_example
      - run: octave --no-gui --quiet --path language/matlab-octave-core --path language/matlab/examples/hitl --eval hitl_example
      - run: octave --no-gui --quiet --path language/matlab-octave-core --path language/matlab/examples/session-checkpoint --eval session_checkpoint_example
