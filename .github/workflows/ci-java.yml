      - "!scripts/test_layout.py"
      - "!scripts/test_registry_pages.py"
      - "!scripts/test_registry_state.py"
      - "!scripts/test_roadmap.py"
      - "!scripts/test_sync_language_mirrors.py"
      - "!scripts/behavior_lab.py"
      - "!scripts/check_ci_workflow_coverage.py"
      - "!scripts/ci_changes.py"
      - "!scripts/compatibility_lab.py"
      - "!scripts/cpp_behavior_suite.py"
      - "!scripts/sync_ci_routing.py"
      - "!scripts/test_behavior_lab.py"
      - "!scripts/test_ci_changes.py"
      - "!scripts/test_ci_execution.py"
      - "!scripts/test_compatibility_lab.py"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
      - "!scripts/build_php_package.py"
      - "!scripts/test_php_package.py"
  pull_request:
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - "language/clojure/**"
      - "language/groovy/**"
      - "language/java/**"
      - "language/kotlin/**"
      - "language/scala/**"
      - ".github/workflows/ci-java.yml"
      - "!scripts/check_adapter_status.py"
      - "!scripts/check_consumer_pins.py"
      - "!scripts/check_language_releases.py"
      - "!scripts/check_registry_pages.py"
      - "!scripts/check_registry_state.py"
      - "!scripts/docs_hooks.py"
      - "!scripts/mirror_readme.py"
      - "!scripts/registry_catalog.py"
      - "!scripts/registry_discovery.py"
      - "!scripts/repository_discovery.py"
      - "!scripts/sync_language_mirrors.py"
      - "!scripts/sync_language_registry_docs.py"
      - "!scripts/test_adapter_status.py"
      - "!scripts/test_consumer_pins.py"
      - "!scripts/test_discovery.py"
      - "!scripts/test_docs.py"
      - "!scripts/test_language_registry_docs.py"
      - "!scripts/test_language_releases.py"
      - "!scripts/test_layout.py"
      - "!scripts/test_registry_pages.py"
      - "!scripts/test_registry_state.py"
      - "!scripts/test_roadmap.py"
      - "!scripts/test_sync_language_mirrors.py"
      - "!scripts/behavior_lab.py"
      - "!scripts/check_ci_workflow_coverage.py"
      - "!scripts/ci_changes.py"
      - "!scripts/compatibility_lab.py"
      - "!scripts/cpp_behavior_suite.py"
      - "!scripts/sync_ci_routing.py"
      - "!scripts/test_behavior_lab.py"
      - "!scripts/test_ci_changes.py"
      - "!scripts/test_ci_execution.py"
      - "!scripts/test_compatibility_lab.py"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
      - "!scripts/build_php_package.py"
      - "!scripts/test_php_package.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-java.yml
        run: python scripts/ci_changes.py

  java-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -q -DskipTests test-compile
      - run: mvn -q -DskipTests package
      - run: java -cp target/classes com.axisvela.praxo.conformance.ApiSnapshot --check
      - run: java -cp target/classes com.axisvela.praxo.conformance.Run
      - run: java --add-modules jdk.httpserver -cp target/classes:target/test-classes com.axisvela.praxo.adapters.OpenAICompatibleSelfTest
      - run: java --add-modules jdk.httpserver -cp target/classes:target/test-classes com.axisvela.praxo.adapters.ProviderAdaptersSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.adapters.OtelSinkSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.agent.delegation.DelegationSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.retriever.RetrieverSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.agent.AgentConcurrencySelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.agent.AgentAuthorizationSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.agent.AgentLifecycleSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.agent.AgentGuardrailSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.agent.AgentStreamSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.jsonschema.JsonSchemaSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.checkpoint.CheckpointSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.middleware.PiiMiddlewareSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.plugin.ProcessHostSelfTest
      - run: javac -cp target/classes -d build/representative-chain examples/representative-chain/src/main/java/representativechain/RepresentativeChain.java
      - run: java -cp target/classes:build/representative-chain representativechain.RepresentativeChain

  current-java-consumer:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['21']
        include:
          - os: ubuntu-latest
            java: '23'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_java_consumer.py -v
      - run: python scripts/test_java_upgrade.py -v

  kotlin-sample:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java') || contains(fromJSON(needs.changes.outputs.languages), 'kotlin')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -d language/java/build/classes $(find language/java/src/main/java -name '*.java')
      - run: curl -fL -o kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
      - run: unzip -q kotlin-compiler.zip
      - run: kotlinc/bin/kotlinc -cp language/java/build/classes -include-runtime -d language/kotlin/examples/sample.jar language/kotlin/examples/sample.kt
      - run: java -cp language/kotlin/examples/sample.jar:language/java/build/classes SampleKt

  scala-sample:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java') || contains(fromJSON(needs.changes.outputs.languages), 'scala')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -d language/java/build/classes $(find language/java/src/main/java -name '*.java')
      - uses: VirtusLab/scala-cli-setup@main
      - run: scala-cli run language/scala/examples/sample.scala --classpath language/java/build/classes --server=false --jvm 21

  groovy-sample:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'groovy') || contains(fromJSON(needs.changes.outputs.languages), 'java')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -d language/java/build/classes $(find language/java/src/main/java -name '*.java')
      - run: curl -fL -o groovy.zip https://archive.apache.org/dist/groovy/4.0.24/distribution/apache-groovy-binary-4.0.24.zip
      - run: unzip -q groovy.zip
      - run: groovy-4.0.24/bin/groovy -cp language/java/build/classes language/groovy/examples/sample.groovy

  clojure-sample:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'clojure') || contains(fromJSON(needs.changes.outputs.languages), 'java')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -d language/java/build/classes $(find language/java/src/main/java -name '*.java')
      - run: sudo apt-get update && sudo apt-get install -y clojure
      - run: CLASSPATH=language/java/build/classes clojure language/clojure/examples/sample.clj
