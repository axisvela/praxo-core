name: ci-examples-matlab

on:
  push:
    branches: [main]
    paths:
      - "language/matlab/**"
      - "language/matlab-octave-core/**"
      - ".github/workflows/ci-examples-matlab.yml"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
  pull_request:
    paths:
      - "language/matlab/**"
      - "language/matlab-octave-core/**"
      - ".github/workflows/ci-examples-matlab.yml"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-examples-matlab.yml
        run: python -m scripts.ci.ci_changes

  matlab-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'matlab') || contains(fromJSON(needs.changes.outputs.languages), 'matlab-octave-core')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'c') || contains(fromJSON(needs.changes.outputs.example_languages), 'cobol') || contains(fromJSON(needs.changes.outputs.example_languages), 'cpp') || contains(fromJSON(needs.changes.outputs.example_languages), 'fortran') || contains(fromJSON(needs.changes.outputs.example_languages), 'lua') || contains(fromJSON(needs.changes.outputs.example_languages), 'r')
      - run: sudo apt-get install -y octave
      - run: octave --no-gui --quiet --path language/matlab/examples/retry --eval retry_example
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab')
      - run: octave --no-gui --quiet --path language/matlab-octave-core --path language/matlab/examples/checkpoint --eval checkpoint_example
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab') || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab-octave-core')
      - run: octave --no-gui --quiet --path language/matlab-octave-core --path language/matlab/examples/event-sink --eval event_sink_example
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab') || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab-octave-core')
      - run: octave --no-gui --quiet --path language/matlab/examples/provider-fallback --eval fallback_example
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab')
      - run: octave --no-gui --quiet --path language/matlab-octave-core --path language/matlab/examples/structured-output --eval structured_output_example
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab') || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab-octave-core')
      - run: octave --no-gui --quiet --path language/matlab/examples/streaming --eval streaming_example
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab')
      - run: octave --no-gui --quiet --path language/matlab/examples/identity-policy --eval identity_policy_example
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab')
      - run: octave --no-gui --quiet --path language/matlab/examples/service --eval service_example
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab')
      - run: octave --no-gui --quiet --path language/matlab/examples/mcp --eval mcp_example
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab')
      - run: octave --no-gui --quiet --path language/matlab-octave-core --path language/matlab/examples/hitl --eval hitl_example
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab') || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab-octave-core')
      - run: octave --no-gui --quiet --path language/matlab-octave-core --path language/matlab/examples/session-checkpoint --eval session_checkpoint_example
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab') || contains(fromJSON(needs.changes.outputs.example_languages), 'matlab-octave-core')
