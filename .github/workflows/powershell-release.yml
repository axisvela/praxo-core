name: powershell-release

on:
  push:
    tags:
      - "powershell/v*"
  workflow_dispatch:
    inputs:
      target:
        description: Publish target
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - publish

permissions:
  contents: read

concurrency:
  group: powershell-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Verify manifest version and tag
        shell: pwsh
        run: |
          $manifest = Import-PowerShellDataFile ./language/powershell/praxo-core-ps/praxo-core-ps.psd1
          $version = $manifest.ModuleVersion
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ("powershell/v$version" -ne $env:GITHUB_REF_NAME) {
              throw "manifest version does not match tag"
            }
          }
      - name: Build C# Core
        run: dotnet build language/csharp/Praxo.Core/Praxo.Core.csproj -c Release
      - name: Bundle C# Core assembly
        run: Copy-Item language/csharp/Praxo.Core/bin/Release/net8.0/Praxo.Core.dll language/powershell/praxo-core-ps/
      - name: Run wrapper tests
        run: pwsh -NoProfile -File language/powershell/tests/run.ps1
      - name: Check API snapshot
        run: pwsh -NoProfile -File language/powershell/api-snapshot.ps1 -Check
      - uses: actions/upload-artifact@v4
        with:
          name: powershell-core-module
          path: language/powershell/praxo-core-ps
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'publish')
    runs-on: ubuntu-latest
    environment:
      name: powershell-gallery
      url: https://www.powershellgallery.com/packages/praxo-core-ps
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: powershell-core-module
          path: module/praxo-core-ps
      - name: Check published version
        id: registry
        shell: pwsh
        run: |
          $manifest = Import-PowerShellDataFile ./module/praxo-core-ps/praxo-core-ps.psd1
          $version = $manifest.ModuleVersion
          $published = Find-Module -Name praxo-core-ps -Repository PSGallery -ErrorAction SilentlyContinue
          if ($published -and $published.Version.ToString() -eq $version) {
            "already_published=true" >> $env:GITHUB_OUTPUT
            "praxo-core-ps@$version is already published; skipping publish"
          } else {
            "already_published=false" >> $env:GITHUB_OUTPUT
          }
      - name: Publish to PowerShell Gallery
        if: steps.registry.outputs.already_published != 'true'
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw "PSGALLERY_API_KEY is not configured" }
          Publish-Module -Path ./module/praxo-core-ps -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY
