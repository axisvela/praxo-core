name: ci-examples

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "language/python/examples/**"
      - "language/typescript/examples/**"
      - "language/csharp/examples/**"
      - "language/rust/examples/**"
      - "language/java/examples/**"
      - "language/ruby/examples/**"
      - "language/php/examples/**"
      - "language/c/examples/**"
      - "language/cpp/examples/**"
      - "language/fortran/examples/**"
      - "language/elixir/examples/**"
      - "language/erlang/examples/**"
      - "language/lua/examples/**"
      - "language/r/examples/**"
      - "language/cobol/examples/**"
      - ".github/workflows/ci-examples.yml"
  pull_request:
    paths:
      - "examples/**"
      - "language/python/examples/**"
      - "language/typescript/examples/**"
      - "language/csharp/examples/**"
      - "language/rust/examples/**"
      - "language/java/examples/**"
      - "language/ruby/examples/**"
      - "language/php/examples/**"
      - "language/c/examples/**"
      - "language/cpp/examples/**"
      - "language/fortran/examples/**"
      - "language/elixir/examples/**"
      - "language/erlang/examples/**"
      - "language/lua/examples/**"
      - "language/r/examples/**"
      - "language/cobol/examples/**"
      - ".github/workflows/ci-examples.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  examples:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test ./...
        working-directory: examples/ecosystem-sdk
      - run: go vet ./...
        working-directory: examples/ecosystem-sdk
      - run: go build ./...
        working-directory: examples/ecosystem-sdk
      - run: go test ./...
        working-directory: examples/ecosystem/mcp
      - run: go vet ./...
        working-directory: examples/ecosystem/mcp
      - run: go build ./...
        working-directory: examples/ecosystem/mcp
      - run: go test ./...
        working-directory: examples/workspace-agent
      - run: go vet ./...
        working-directory: examples/workspace-agent
      - run: go test ./...
        working-directory: examples/embedded-service
      - run: go vet ./...
        working-directory: examples/embedded-service
      - run: go test ./...
        working-directory: examples/embedded-service-auth
      - run: go vet ./...
        working-directory: examples/embedded-service-auth
      - run: go test ./...
        working-directory: examples/live-model/go
      - run: go vet ./...
        working-directory: examples/live-model/go

  example-sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -r requirements.txt
        working-directory: language/python/examples/mcp
      - run: python -m unittest test_client.py -v
        working-directory: language/python/examples/mcp
      - run: python -m pip install -r requirements.txt
        working-directory: language/python/examples/structured-output
      - run: python -m unittest test_summarize.py -v
        working-directory: language/python/examples/structured-output
      - run: python -m pip install -r requirements.txt
        working-directory: language/python/examples/service
      - run: python -m unittest test_service.py -v
        working-directory: language/python/examples/service
      - run: python -m pip install -r requirements.txt
        working-directory: language/python/examples/provider-fallback
      - run: python -m unittest test_fallback.py -v
        working-directory: language/python/examples/provider-fallback
      - run: python -m pip install -r requirements.txt
        working-directory: language/python/examples/event-sink
      - run: python -m unittest test_event_sink.py -v
        working-directory: language/python/examples/event-sink
      - run: python -m pip install -r requirements.txt
        working-directory: language/python/examples/streaming
      - run: python -m unittest test_streaming.py -v
        working-directory: language/python/examples/streaming
      - run: python -m pip install -r requirements.txt
        working-directory: language/python/examples/checkpoint
      - run: python -m unittest test_checkpoint_store.py -v
        working-directory: language/python/examples/checkpoint
      - run: python -m pip install -r requirements.txt
        working-directory: language/python/examples/retry
      - run: python -m unittest test_retry.py -v
        working-directory: language/python/examples/retry
      - run: python -m pip install -r requirements.txt
        working-directory: language/python/examples/identity-policy
      - run: python -m unittest test_identity_policy.py -v
        working-directory: language/python/examples/identity-policy
      - run: npm ci --no-audit --no-fund
        working-directory: language/typescript/examples/mcp
      - run: npm test
        working-directory: language/typescript/examples/mcp
      - run: npm ci --no-audit --no-fund
        working-directory: language/typescript/examples/structured-output
      - run: npm test
        working-directory: language/typescript/examples/structured-output
      - run: npm ci --no-audit --no-fund
        working-directory: language/typescript/examples/provider-fallback
      - run: npm test
        working-directory: language/typescript/examples/provider-fallback
      - run: npm ci --no-audit --no-fund
        working-directory: language/typescript/examples/event-sink
      - run: npm test
        working-directory: language/typescript/examples/event-sink
      - run: npm ci --no-audit --no-fund
        working-directory: language/typescript/examples/streaming
      - run: npm test
        working-directory: language/typescript/examples/streaming
      - run: npm ci --no-audit --no-fund
        working-directory: language/typescript/examples/checkpoint
      - run: npm test
        working-directory: language/typescript/examples/checkpoint
      - run: npm ci --no-audit --no-fund
        working-directory: language/typescript/examples/retry
      - run: npm test
        working-directory: language/typescript/examples/retry
      - run: npm ci --no-audit --no-fund
        working-directory: language/typescript/examples/service
      - run: npm test
        working-directory: language/typescript/examples/service
      - run: npm ci --no-audit --no-fund
        working-directory: language/typescript/examples/identity-policy
      - run: npm test
        working-directory: language/typescript/examples/identity-policy
      - run: dotnet run --project language/csharp/examples/mcp/Mcp.csproj -- --test
      - run: dotnet run --project language/csharp/examples/structured-output/StructuredOutput.csproj -- --test
      - run: dotnet run --project language/csharp/examples/provider-fallback/ProviderFallback.csproj -- --test
      - run: dotnet run --project language/csharp/examples/event-sink/EventSink.csproj -- --test
      - run: dotnet run --project language/csharp/examples/streaming/Streaming.csproj -- --test
      - run: dotnet run --project language/csharp/examples/checkpoint/Checkpoint.csproj -- --test
      - run: dotnet run --project language/csharp/examples/retry/Retry.csproj -- --test
      - run: dotnet run --project language/csharp/examples/service/Service.csproj -- --test
      - run: dotnet run --project language/csharp/examples/identity-policy/IdentityPolicy.csproj -- --test
      - run: mvn -q -f language/java/examples/event-sink/pom.xml compile exec:java
      - run: mvn -q -f language/java/examples/streaming/pom.xml compile exec:java
      - run: mvn -q -f language/java/examples/retry/pom.xml compile exec:java
      - run: mvn -q -f language/java/examples/identity-policy/pom.xml compile exec:java
      - run: mvn -q -f language/java/examples/checkpoint/pom.xml compile exec:java
      - run: mvn -q -f language/java/examples/service/pom.xml compile exec:java -Dexec.args=--test
      - run: mvn -q -f language/java/examples/provider-fallback/pom.xml compile exec:java
      - run: ruby -I language/ruby/lib language/ruby/examples/event-sink/test_event_sink.rb
      - run: ruby -I language/ruby/lib language/ruby/examples/retry/test_retry.rb
      - run: php language/php/examples/event-sink/test_event_sink.php
      - run: php language/php/examples/retry/test_retry.php
      - run: ruby -I language/ruby/lib language/ruby/examples/checkpoint/checkpoint.rb
      - run: php language/php/examples/checkpoint/checkpoint.php
      - run: mkdir -p language/elixir/build/ebin
      - run: elixirc -o language/elixir/build/ebin language/elixir/lib/praxo/*.ex language/elixir/lib/praxo/adapters/*.ex
      - run: elixir -pa language/elixir/build/ebin language/elixir/examples/checkpoint/checkpoint.exs
      - run: mkdir -p language/erlang/build/ebin
      - run: erlc -I language/erlang/src -o language/erlang/build/ebin language/erlang/src/*.erl
      - run: escript language/erlang/examples/checkpoint/checkpoint.escript
      - run: lua language/lua/examples/checkpoint/checkpoint.lua
      - run: cmake -S language/c -B language/c/build
      - run: cmake --build language/c/build
      - run: gcc -std=c11 -I language/c/include language/c/examples/checkpoint/main.c language/c/build/libpraxo_core.a -o language/c/build/c-checkpoint
      - run: language/c/build/c-checkpoint
      - run: cmake -S language/cpp -B language/cpp/build
      - run: cmake --build language/cpp/build --target praxo-cpp-checkpoint-example praxo-cpp-event-sink-example praxo-cpp-streaming-example praxo-cpp-structured-output-example
      - run: language/cpp/build/praxo-cpp-checkpoint-example
      - run: language/cpp/build/praxo-cpp-event-sink-example
      - run: language/cpp/build/praxo-cpp-streaming-example
      - run: language/cpp/build/praxo-cpp-structured-output-example
      - run: python language/fortran/examples/checkpoint/run.py
      - run: sudo apt-get update
      - run: sudo apt-get install -y gnucobol r-base-core
      - run: Rscript language/r/examples/checkpoint/checkpoint.R
      - run: python language/cobol/examples/checkpoint/build.py
      - run: gcc -std=c11 -I language/c/include language/c/examples/event-sink/main.c language/c/build/libpraxo_core.a -o language/c/build/c-event-sink
      - run: language/c/build/c-event-sink
      - run: python language/fortran/examples/event-sink/run.py
      - run: elixir -pa language/elixir/build/ebin language/elixir/examples/event-sink/event_sink.exs
      - run: escript language/erlang/examples/event-sink/event_sink.escript
      - run: lua language/lua/examples/event-sink/event_sink.lua
      - run: Rscript language/r/examples/event-sink/event_sink.R
      - run: python language/cobol/examples/event-sink/build.py
      - run: gcc -std=c11 language/c/examples/retry/main.c -o language/c/build/c-retry
      - run: language/c/build/c-retry
      - run: g++ -std=c++20 language/cpp/examples/retry/main.cpp -o language/cpp/build/cpp-retry
      - run: language/cpp/build/cpp-retry
      - run: gfortran language/fortran/examples/retry/retry_example.f90 -o language/fortran/build/fortran-retry
      - run: language/fortran/build/fortran-retry
      - run: elixir language/elixir/examples/retry/retry.exs
      - run: escript language/erlang/examples/retry/retry.escript
      - run: lua language/lua/examples/retry/retry.lua
      - run: Rscript language/r/examples/retry/retry.R
      - run: python language/cobol/examples/retry/build.py
      - run: ruby -I language/ruby/lib language/ruby/examples/provider-fallback/test_fallback.rb
      - run: php language/php/examples/provider-fallback/test_fallback.php
      - run: gcc -std=c11 language/c/examples/provider-fallback/main.c -o language/c/build/c-fallback
      - run: language/c/build/c-fallback
      - run: g++ -std=c++20 language/cpp/examples/provider-fallback/main.cpp -o language/cpp/build/cpp-fallback
      - run: language/cpp/build/cpp-fallback
      - run: gfortran language/fortran/examples/provider-fallback/fallback_example.f90 -o language/fortran/build/fortran-fallback
      - run: language/fortran/build/fortran-fallback
      - run: elixir language/elixir/examples/provider-fallback/fallback.exs
      - run: escript language/erlang/examples/provider-fallback/fallback.escript
      - run: lua language/lua/examples/provider-fallback/fallback.lua
      - run: Rscript language/r/examples/provider-fallback/fallback.R
      - run: python language/cobol/examples/provider-fallback/build.py
      - run: ruby -I language/ruby/lib language/ruby/examples/streaming/streaming.rb
      - run: php language/php/examples/streaming/streaming.php
      - run: gcc -std=c11 -I language/c/include language/c/examples/streaming/main.c language/c/build/libpraxo_core.a -o language/c/build/c-streaming
      - run: language/c/build/c-streaming
      - run: elixir -pa language/elixir/build/ebin language/elixir/examples/streaming/streaming.exs
      - run: escript language/erlang/examples/streaming/streaming.escript
      - run: lua language/lua/examples/streaming/streaming.lua
      - run: Rscript language/r/examples/streaming/streaming.R
      - run: python language/cobol/examples/streaming/build.py
      - run: ruby -I language/ruby/lib language/ruby/examples/structured-output/structured_output.rb
      - run: php language/php/examples/structured-output/structured_output.php
      - run: gcc -std=c11 -I language/c/include language/c/examples/structured-output/main.c language/c/build/libpraxo_core.a -o language/c/build/c-structured-output
      - run: language/c/build/c-structured-output
      - run: python language/fortran/examples/structured-output/run.py
      - run: elixir -pa language/elixir/build/ebin language/elixir/examples/structured-output/structured_output.exs
      - run: escript language/erlang/examples/structured-output/structured_output.escript
      - run: lua language/lua/examples/structured-output/structured_output.lua
      - run: Rscript language/r/examples/structured-output/structured_output.R
      - run: python language/cobol/examples/structured-output/build.py
      - run: cargo run --quiet
        working-directory: language/rust/examples/provider-fallback
      - run: cargo run --quiet
        working-directory: language/rust/examples/event-sink
      - run: cargo run --quiet
        working-directory: language/rust/examples/streaming
      - run: cargo run --quiet
        working-directory: language/rust/examples/mcp
      - run: cargo run --quiet
        working-directory: language/rust/examples/structured-output
      - run: cargo run --quiet
        working-directory: language/rust/examples/checkpoint
      - run: cargo run --quiet
        working-directory: language/rust/examples/retry
      - run: cargo run --quiet -- --test
        working-directory: language/rust/examples/service
      - run: cargo run --quiet
        working-directory: language/rust/examples/identity-policy

  current-go-consumer:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: examples/consumer-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: examples/consumer-go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - run: go build -mod=readonly ./...
      - run: go run -mod=readonly .
      - run: python scripts/test_go_consumer.py
        working-directory: .
      - run: python scripts/test_go_upgrade.py -v
        working-directory: .
      - run: python scripts/test_go_longrunning.py -v
        working-directory: .
      - run: python scripts/test_go_identity.py -v
        working-directory: .
      - run: python scripts/test_go_conformance_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_retry_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_event_sink_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_context_budget_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_checkpoint_store_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_structured_output_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_vfs_containment_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_provider_fallback_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_plugin_lifecycle_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_multi_agent_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_streaming_recipe.py -v
        working-directory: .
