      - "!scripts/check_consumer_pins.py"
      - "!scripts/check_language_releases.py"
      - "!scripts/check_registry_pages.py"
      - "!scripts/check_registry_state.py"
      - "!scripts/docs_hooks.py"
      - "!scripts/mirror_readme.py"
      - "!scripts/registry_catalog.py"
      - "!scripts/registry_discovery.py"
      - "!scripts/repository_discovery.py"
      - "!scripts/sync_language_mirrors.py"
      - "!scripts/sync_language_registry_docs.py"
      - "!scripts/test_adapter_status.py"
      - "!scripts/test_consumer_pins.py"
      - "!scripts/test_discovery.py"
      - "!scripts/test_docs.py"
      - "!scripts/test_language_registry_docs.py"
      - "!scripts/test_language_releases.py"
      - "!scripts/test_layout.py"
      - "!scripts/test_registry_pages.py"
      - "!scripts/test_registry_state.py"
      - "!scripts/test_roadmap.py"
      - "!scripts/test_sync_language_mirrors.py"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
  pull_request:
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - "language/c/**"
      - "language/cobol/**"
      - "language/cpp/**"
      - "language/csharp/**"
      - "language/elixir/**"
      - "language/erlang/**"
      - "language/fortran/**"
      - "language/go/**"
      - "language/java/**"
      - "language/lua/**"
      - "language/php/**"
      - "language/python/**"
      - "language/r/**"
      - "language/ruby/**"
      - "language/rust/**"
      - "language/typescript/**"
      - "global.json"
      - ".github/workflows/ci-examples.yml"
      - "!scripts/check_adapter_status.py"
      - "!scripts/check_consumer_pins.py"
      - "!scripts/check_language_releases.py"
      - "!scripts/check_registry_pages.py"
      - "!scripts/check_registry_state.py"
      - "!scripts/docs_hooks.py"
      - "!scripts/mirror_readme.py"
      - "!scripts/registry_catalog.py"
      - "!scripts/registry_discovery.py"
      - "!scripts/repository_discovery.py"
      - "!scripts/sync_language_mirrors.py"
      - "!scripts/sync_language_registry_docs.py"
      - "!scripts/test_adapter_status.py"
      - "!scripts/test_consumer_pins.py"
      - "!scripts/test_discovery.py"
      - "!scripts/test_docs.py"
      - "!scripts/test_language_registry_docs.py"
      - "!scripts/test_language_releases.py"
      - "!scripts/test_layout.py"
      - "!scripts/test_registry_pages.py"
      - "!scripts/test_registry_state.py"
      - "!scripts/test_roadmap.py"
      - "!scripts/test_sync_language_mirrors.py"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-examples.yml
        run: python scripts/ci_changes.py

  examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'go') || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test ./...
        working-directory: language/go/examples/ecosystem-sdk
      - run: go vet ./...
        working-directory: language/go/examples/ecosystem-sdk
      - run: go build ./...
        working-directory: language/go/examples/ecosystem-sdk
      - run: go test ./...
        working-directory: language/go/examples/ecosystem/mcp
      - run: go vet ./...
        working-directory: language/go/examples/ecosystem/mcp
      - run: go build ./...
        working-directory: language/go/examples/ecosystem/mcp
      - run: go test ./...
        working-directory: language/go/examples/workspace-agent
      - run: go vet ./...
        working-directory: language/go/examples/workspace-agent
      - run: go test ./...
        working-directory: language/go/examples/embedded-service
      - run: go vet ./...
        working-directory: language/go/examples/embedded-service
      - run: go test ./...
        working-directory: language/go/examples/embedded-service-auth
      - run: go vet ./...
        working-directory: language/go/examples/embedded-service-auth
      - run: go test -mod=readonly ./...
        working-directory: language/go/examples/recipes/checkpoint-store-go
      - run: go test -mod=readonly ./...
        working-directory: language/go/examples/recipes/event-sinks-go
      - run: go test -mod=readonly ./...
        working-directory: language/go/examples/recipes/retry-go
      - run: go test -mod=readonly ./...
        working-directory: language/go/examples/recipes/provider-fallback-go
      - run: go test -mod=readonly ./...
        working-directory: language/go/examples/recipes/streaming-go
      - run: go test -mod=readonly ./...
        working-directory: language/go/examples/recipes/structured-output-go
      - run: go test -mod=readonly ./...
        working-directory: language/go/examples/recipes/identity-go
      - run: go test ./...
        working-directory: language/go/examples/live-model/go
      - run: go vet ./...
        working-directory: language/go/examples/live-model/go
      - run: GOWORK=off go test ./language/go/examples/hitl
      - run: GOWORK=off go run ./language/go/examples/session-checkpoint
      - run: GOWORK=off go test ./language/go/examples/multiagent
      - run: GOWORK=off go test ./...
        working-directory: language/go/examples/representative-chain

  example-sdks:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'c') || contains(fromJSON(needs.changes.outputs.languages), 'cobol') || contains(fromJSON(needs.changes.outputs.languages), 'cpp') || contains(fromJSON(needs.changes.outputs.languages), 'csharp') || contains(fromJSON(needs.changes.outputs.languages), 'elixir') || contains(fromJSON(needs.changes.outputs.languages), 'erlang') || contains(fromJSON(needs.changes.outputs.languages), 'fortran') || contains(fromJSON(needs.changes.outputs.languages), 'java') || contains(fromJSON(needs.changes.outputs.languages), 'lua') || contains(fromJSON(needs.changes.outputs.languages), 'php') || contains(fromJSON(needs.changes.outputs.languages), 'python') || contains(fromJSON(needs.changes.outputs.languages), 'r') || contains(fromJSON(needs.changes.outputs.languages), 'ruby') || contains(fromJSON(needs.changes.outputs.languages), 'rust') || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'elixir') || contains(fromJSON(needs.changes.outputs.languages), 'erlang')
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
      - uses: luarocks/gh-actions-lua@v10
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'lua')
        with:
          luaVersion: "5.4"
      - uses: actions/setup-go@v5
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'go')
        with:
          go-version: "1.26.11"
      - run: python scripts/check_example_coverage.py
      - run: python scripts/test_example_coverage.py -q
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        with:
          node-version: "20"
      - uses: actions/setup-dotnet@v4
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'csharp')
        with:
          dotnet-version: "8.0.x"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'rust')
      - uses: actions/setup-java@v4
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
        with:
          distribution: temurin
          java-version: "21"
      - uses: shivammathur/setup-php@v2
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'php')
        with:
          php-version: "8.4.27"
      - uses: ruby/setup-ruby@v1
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'ruby')
        with:
          ruby-version: "3.4"
      - run: python -m pip install -r requirements.txt
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/mcp
      - run: python -m unittest test_client.py -v
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/mcp
      - run: python -m pip install -r requirements.txt
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/structured-output
      - run: python -m unittest test_summarize.py -v
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/structured-output
      - run: python -m pip install -r requirements.txt
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/structured-output-app
      - run: python -m unittest test_app.py -v
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/structured-output-app
      - run: python -m pip install -r requirements.txt
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/service
      - run: python -m unittest test_service.py -v
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/service
      - run: python -m pip install -r requirements.txt
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/service-auth
      - run: python -m unittest test_service.py -v
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/service-auth
      - run: python -m pip install -r requirements.txt
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/provider-fallback
      - run: python -m unittest test_fallback.py -v
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/provider-fallback
      - run: python -m pip install -r requirements.txt
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/event-sink
      - run: python -m unittest test_event_sink.py -v
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/event-sink
      - run: python -m pip install -r requirements.txt
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/streaming
      - run: python -m unittest test_streaming.py -v
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/streaming
      - run: python -m pip install -r requirements.txt
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/checkpoint
      - run: python -m unittest test_checkpoint_store.py -v
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/checkpoint
      - run: python -m pip install -r requirements.txt
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/retry
      - run: python -m unittest test_retry.py -v
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/retry
      - run: python -m pip install -r requirements.txt
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/identity-policy
      - run: python -m unittest test_identity_policy.py -v
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
        working-directory: language/python/examples/identity-policy
      - run: npm ci --no-audit --no-fund
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/mcp
      - run: npm test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/mcp
      - run: npm ci --no-audit --no-fund
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/structured-output
      - run: npm test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/structured-output
      - run: npm ci --no-audit --no-fund
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/provider-fallback
      - run: npm test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/provider-fallback
      - run: npm ci --no-audit --no-fund
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/event-sink
      - run: npm test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/event-sink
      - run: npm ci --no-audit --no-fund
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/streaming
      - run: npm test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/streaming
      - run: npm ci --no-audit --no-fund
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/checkpoint
      - run: npm test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/checkpoint
      - run: npm ci --no-audit --no-fund
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/retry
      - run: npm test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/retry
      - run: npm ci --no-audit --no-fund
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/service
      - run: npm test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/service
      - run: npm ci --no-audit --no-fund
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/service-auth
      - run: npm test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/service-auth
      - run: npm ci --no-audit --no-fund
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/identity-policy
      - run: npm test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
        working-directory: language/typescript/examples/identity-policy
      - run: dotnet run --project language/csharp/examples/mcp/Mcp.csproj -- --test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'csharp')
      - run: dotnet run --project language/csharp/examples/structured-output/StructuredOutput.csproj -- --test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'csharp')
      - run: dotnet run --project language/csharp/examples/provider-fallback/ProviderFallback.csproj -- --test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'csharp')
      - run: dotnet run --project language/csharp/examples/event-sink/EventSink.csproj -- --test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'csharp')
      - run: dotnet run --project language/csharp/examples/streaming/Streaming.csproj -- --test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'csharp')
      - run: dotnet run --project language/csharp/examples/checkpoint/Checkpoint.csproj -- --test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'csharp')
      - run: dotnet run --project language/csharp/examples/retry/Retry.csproj -- --test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'csharp')
      - run: dotnet run --project language/csharp/examples/service/Service.csproj -- --test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'csharp')
      - run: dotnet run --project language/csharp/examples/identity-policy/IdentityPolicy.csproj -- --test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'csharp')
      - run: mvn -q -f language/java/examples/event-sink/pom.xml compile exec:java
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
      - run: mvn -q -f language/java/examples/streaming/pom.xml compile exec:java
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
      - run: mvn -q -f language/java/examples/retry/pom.xml compile exec:java
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
      - run: mvn -q -f language/java/examples/identity-policy/pom.xml compile exec:java
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
      - run: mvn -q -f language/java/examples/checkpoint/pom.xml compile exec:java
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
      - run: mvn -q -f language/java/examples/service/pom.xml compile exec:java -Dexec.args=--test
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
      - run: mvn -q -f language/java/examples/provider-fallback/pom.xml compile exec:java
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
      - run: ruby -I language/ruby/lib language/ruby/examples/event-sink/test_event_sink.rb
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'ruby')
      - run: ruby -I language/ruby/lib language/ruby/examples/retry/test_retry.rb
