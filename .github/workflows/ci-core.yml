name: ci-core

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - ".github/workflows/ci-core.yml"
      - "!scripts/discovery/**"
      - "!scripts/checks/**"
      - "!scripts/release/**"
      - "!scripts/execution/**"
      - "!scripts/validation/**"
      - "!scripts/ci/**"
      - "!scripts/labs/**"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
      - "!scripts/consumers/go/**"
      - "!scripts/consumers/java/**"
      - "!scripts/consumers/longrunning/**"
      - "!scripts/consumers/python/**"
      - "!scripts/consumers/typescript/**"
      - "!scripts/languages/ocaml/**"
      - "!scripts/languages/php/**"
  pull_request:
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - ".github/workflows/ci-core.yml"
      - "!scripts/discovery/**"
      - "!scripts/checks/**"
      - "!scripts/release/**"
      - "!scripts/execution/**"
      - "!scripts/validation/**"
      - "!scripts/ci/**"
      - "!scripts/labs/**"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
      - "!scripts/consumers/go/**"
      - "!scripts/consumers/java/**"
      - "!scripts/consumers/longrunning/**"
      - "!scripts/consumers/python/**"
      - "!scripts/consumers/typescript/**"
      - "!scripts/languages/ocaml/**"
      - "!scripts/languages/php/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-core.yml
        run: python -m scripts.ci.ci_changes

  published-consumer:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: tests/consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: tests/consumer/go.sum
      - run: go test -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - run: go build -mod=readonly ./...

  test:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

      - name: Verify release gate failure propagation
        shell: pwsh
        run: ./scripts/release/powershell/release-check.Tests.ps1

      - name: Verify API snapshot failure propagation
        shell: pwsh
        run: ./scripts/release/powershell/api-snapshot.Tests.ps1

      - name: Check Go public API snapshot
        shell: pwsh
        run: ./scripts/release/powershell/api-snapshot.ps1 -Check

  containment-linux:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: Verify platform containment controls
        run: go test -count=1 -v -timeout 10m ./pkg/policy ./pkg/vfs/localfs ./pkg/plugin/host/process ./pkg/plugin/host/wasm

  spec-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test -count=1 ./internal/spec/... -v

  privacy:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test -count=1 ./internal/spec -run 'TestNoDisallowedEmails|TestNoInternalHostnames' -v
      - run: go test -count=1 ./internal/spec -run TestGitHistoryEmails -v
        env:
          PRAXO_DISALLOWED_EMAIL_DOMAINS: ${{ secrets.PRAXO_DISALLOWED_EMAIL_DOMAINS }}

  benchmarks:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test ./benchmarks -run=^$ -bench '.*' -benchtime=10x

  race:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test -race ./...

  fuzz:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test ./pkg/plugin -run=^$ -fuzz=FuzzParseManifest -fuzztime=10s
      - run: go test ./pkg/toolcall -run=^$ -fuzz=FuzzParseToolCall -fuzztime=10s
      - run: go test ./pkg/tool/jsonschema -run=^$ -fuzz=FuzzFromJSON -fuzztime=10s
      - run: go test ./pkg/policy -run=^$ -fuzz=FuzzPathChecker -fuzztime=5s

  quality:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
  lisp-bridge:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y sbcl
      - run: python bindings/lisp/test_bridge.py

  tcl-bridge:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tcl
      - run: python bindings/tcl/test_bridge.py

  prolog-bridge:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y swi-prolog
      - run: python bindings/prolog/test_bridge.py

