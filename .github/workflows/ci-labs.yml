name: ci-labs

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "scripts/**"
      - ".github/workflows/ci-labs.yml"
  pull_request:
    paths:
      - "spec/**"
      - "scripts/**"
      - ".github/workflows/ci-labs.yml"
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-labs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: language/typescript/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update
      - run: sudo apt-get install -y gfortran gnucobol g++ cmake ninja-build
      - run: python -m unittest discover -s scripts -p "test_compatibility_lab.py" -v
      - run: python scripts/compatibility_lab.py --install --strict --timeout 1200 --languages python,typescript,java,rust,fortran,cobol
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-lab-report
          path: build/compatibility-lab
          if-no-files-found: warn

  behavior-lab:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: language/typescript/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
          install-hex: false
          install-rebar: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4.27"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: sudo apt-get update
      - run: sudo apt-get install -y gfortran gnucobol g++ cmake ninja-build lua5.4 r-base
      - run: python -m unittest discover -s scripts -p "test_behavior_lab.py" -v
      - run: npm ci
        working-directory: language/typescript
      - run: npm run build
        working-directory: language/typescript
      - run: mvn -q -DskipTests test-compile
        working-directory: language/java
      - run: cmake -S language/cpp -B language/cpp/build
      - run: cmake --build language/cpp/build
      - run: cmake -S language/c -B language/c/build
      - run: cmake --build language/c/build
      - run: python scripts/behavior_lab.py --strict --timeout 600 --languages go,python,typescript,java,rust,fortran,cobol,ruby,elixir,erlang,cpp,php,csharp,lua,r,c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behavior-lab-report
          path: build/behavior-lab
          if-no-files-found: warn
