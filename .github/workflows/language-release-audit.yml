name: language-release-audit

on:
  push:
    tags:
      - "v*"
      - "*/v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-release-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_language_releases.py
      - run: python -m unittest discover -s scripts -p "test_language_releases.py" -v
