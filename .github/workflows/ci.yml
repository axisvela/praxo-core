name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  published-consumer:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: tests/consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: tests/consumer/go.sum
      - run: go test -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - run: go build -mod=readonly ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

      - name: Verify release gate failure propagation
        shell: pwsh
        run: ./scripts/release-check.Tests.ps1

  spec-conformance:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test -count=1 ./internal/spec/... -v

  privacy:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test -count=1 ./internal/spec -run 'TestNoDisallowedEmails|TestNoInternalHostnames' -v
      - run: go test -count=1 ./internal/spec -run TestGitHistoryEmails -v
        env:
          PRAXO_DISALLOWED_EMAIL_DOMAINS: ${{ secrets.PRAXO_DISALLOWED_EMAIL_DOMAINS }}

  python-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python conformance/run.py
      - run: python api-snapshot.py --check
      - run: python -m unittest discover -s tests -v

  haskell-conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.14.2.0"
      - run: python sdk/haskell/run-tests.py
      - run: cabal build --offline all
        working-directory: sdk/haskell

  typescript-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run api:check
      - run: npm run conformance
      - run: node --test tests/sdk.test.js tests/openaicompat.test.js

  java-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -q -DskipTests test-compile
      - run: mvn -q -DskipTests package
      - run: java -cp target/classes io.axisvela.praxo.conformance.ApiSnapshot --check
      - run: java -cp target/classes io.axisvela.praxo.conformance.Run
      - run: java --add-modules jdk.httpserver -cp target/classes:target/test-classes io.axisvela.praxo.adapters.OpenAICompatibleSelfTest
      - run: java -cp target/classes:target/test-classes io.axisvela.praxo.agent.AgentConcurrencySelfTest

  kotlin-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -d sdk/java/build/classes $(find sdk/java/src/main/java -name '*.java')
      - run: curl -fL -o kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
      - run: unzip -q kotlin-compiler.zip
      - run: kotlinc/bin/kotlinc -cp sdk/java/build/classes -include-runtime -d examples/kotlin/sample.jar examples/kotlin/sample.kt
      - run: java -cp examples/kotlin/sample.jar:sdk/java/build/classes SampleKt

  scala-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -d sdk/java/build/classes $(find sdk/java/src/main/java -name '*.java')
      - uses: VirtusLab/scala-cli-setup@main
      - run: scala-cli run examples/scala/sample.scala --classpath sdk/java/build/classes --server=false --jvm 21

  c-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/c
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  csharp-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build sdk/csharp/Praxo.Core/Praxo.Core.csproj -c Release
      - run: dotnet run --project sdk/csharp/Praxo.Conformance -c Release
      - run: dotnet run --project sdk/csharp/Praxo.Conformance -c Release -- --check-api
      - run: dotnet run --project sdk/csharp/Praxo.Tests -c Release
      - run: dotnet run --project sdk/csharp/samples/VbSample -c Release

  php-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: php sdk/php/conformance/run.php
      - run: php sdk/php/conformance/run.php --check-api
      - run: php sdk/php/tests/run.php

  swift-conformance:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sdk/swift
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift run praxo-conformance
      - run: python3 api-snapshot.py --check

  fortran-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install -y gfortran
      - run: python3 sdk/fortran/run-tests.py

  cobol-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install -y gnucobol
      - run: python3 sdk/cobol/run-tests.py

  d-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/d
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned DMD compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.113.0 --repo dlang/dmd --pattern dmd.2.113.0.linux.tar.xz --dir "$RUNNER_TEMP/praxo-dmd"
          echo "b342ab8bd40cc0c46407692b31d7cd69661ff01da686234f426949e881727294  $RUNNER_TEMP/praxo-dmd/dmd.2.113.0.linux.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/praxo-dmd/dmd.2.113.0.linux.tar.xz" -C "$RUNNER_TEMP/praxo-dmd"
          echo "$RUNNER_TEMP/praxo-dmd/dmd2/linux/bin64" >> "$GITHUB_PATH"
      - run: mkdir -p build
      - run: dmd -i -Isource -O -release source/conformance.d -of=build/conformance
      - run: ./build/conformance
      - run: dmd -i -Isource -O -release source/tests.d -of=build/tests
      - run: ./build/tests
      - run: python3 api-snapshot.py --check

  zig-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/zig
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"
      - run: mkdir -p build
      - run: zig build-exe src/conformance.zig -O ReleaseSafe -femit-bin=build/conformance
      - run: ./build/conformance
      - run: zig test src/toolcall.zig
      - run: zig test src/jsonschema.zig
      - run: zig test src/plugin.zig
      - run: zig test src/pii_test.zig
      - run: python3 api-snapshot.py --check

  dart-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart run conformance/run.dart
      - run: python3 api-snapshot.py --check
      - run: dart run tests/run.dart

  javascript-sample:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: node ../../examples/javascript/sample.mjs

  lua-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 sdk/lua/conformance/run.lua
      - run: python3 sdk/lua/api-snapshot.py --check
      - run: lua5.4 sdk/lua/tests/run.lua

  ruby-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: ruby sdk/ruby/conformance/run.rb
      - run: ruby sdk/ruby/api-snapshot.rb --check
      - run: ruby sdk/ruby/tests/run.rb

  cpp-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S sdk/cpp -B sdk/cpp/build
      - run: cmake --build sdk/cpp/build
      - run: ctest --test-dir sdk/cpp/build --output-on-failure
      - run: python3 sdk/cpp/api-snapshot.py --check

  perl-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: perl sdk/perl/conformance/run.pl
      - run: perl sdk/perl/api-snapshot.pl --check
      - run: perl sdk/perl/tests/run.pl

  julia-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - run: julia --project=sdk/julia -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=sdk/julia sdk/julia/conformance/run.jl
      - run: julia --project=sdk/julia sdk/julia/api-snapshot.jl --check
      - run: julia --project=sdk/julia sdk/julia/test/runtests.jl

  r-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - run: Rscript sdk/r/conformance/run.R
      - run: Rscript sdk/r/api-snapshot.R --check
      - run: Rscript sdk/r/tests/run_tests.R

  bridge:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test ./internal/bridge ./cmd/praxo-bridge
      - run: go run ./cmd/praxo-bridge version
      - run: bash bindings/shell/praxo-bridge.sh version
      - run: pwsh -NoProfile -Command "Import-Module ./bindings/powershell/PraxoBridge.psm1; Invoke-PraxoBridge -Arguments @('version')"

  rust-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo run --quiet --bin conformance

  examples:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test ./...
        working-directory: examples/ecosystem-sdk
      - run: go vet ./...
        working-directory: examples/ecosystem-sdk
      - run: go build ./...
        working-directory: examples/ecosystem-sdk
      - run: go test ./...
        working-directory: examples/ecosystem/mcp
      - run: go vet ./...
        working-directory: examples/ecosystem/mcp
      - run: go build ./...
        working-directory: examples/ecosystem/mcp

  adapters:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test ./...
        working-directory: adapters/mcp
      - run: go vet ./...
        working-directory: adapters/mcp
      - run: go build ./...
        working-directory: adapters/mcp
      - run: go test ./...
        working-directory: adapters/otel
      - run: go vet ./...
        working-directory: adapters/otel
      - run: go build ./...
        working-directory: adapters/otel
      - run: go test ./...
        working-directory: adapters/anthropic
      - run: go vet ./...
        working-directory: adapters/anthropic
      - run: go build ./...
        working-directory: adapters/anthropic
      - run: go test ./...
        working-directory: adapters/gemini
      - run: go vet ./...
        working-directory: adapters/gemini
      - run: go build ./...
        working-directory: adapters/gemini
      - run: go test ./...
        working-directory: adapters/harmovela
      - run: go vet ./...
        working-directory: adapters/harmovela
      - run: go build ./...
        working-directory: adapters/harmovela
      - run: go test ./...
        working-directory: adapters/a2a
      - run: go vet ./...
        working-directory: adapters/a2a
      - run: go build ./...
        working-directory: adapters/a2a
      - run: go test ./...
        working-directory: adapters/multiagent
      - run: go vet ./...
        working-directory: adapters/multiagent
      - run: go build ./...
        working-directory: adapters/multiagent
      - run: go test ./...
        working-directory: adapters/workspace
      - run: go vet ./...
        working-directory: adapters/workspace
      - run: go build ./...
        working-directory: adapters/workspace
      - run: go test ./...
        working-directory: adapters/workspace/e2b
      - run: go vet ./...
        working-directory: adapters/workspace/e2b
      - run: go build ./...
        working-directory: adapters/workspace/e2b
      - run: go test ./...
        working-directory: adapters/workspace/daytona
      - run: go vet ./...
        working-directory: adapters/workspace/daytona
      - run: go build ./...
        working-directory: adapters/workspace/daytona
      - run: go test ./...
        working-directory: adapters/workspace/opensandbox
      - run: go vet ./...
        working-directory: adapters/workspace/opensandbox
      - run: go build ./...
        working-directory: adapters/workspace/opensandbox
      - run: go test ./...
        working-directory: adapters/workspace/cubesandbox
      - run: go vet ./...
        working-directory: adapters/workspace/cubesandbox
      - run: go build ./...
        working-directory: adapters/workspace/cubesandbox

  module-security:
    strategy:
      fail-fast: false
      matrix:
        module:
          - adapters/mcp
          - adapters/otel
          - adapters/anthropic
          - adapters/gemini
          - adapters/harmovela
          - adapters/a2a
          - adapters/multiagent
          - adapters/workspace
          - adapters/workspace/e2b
          - adapters/workspace/daytona
          - adapters/workspace/opensandbox
          - adapters/workspace/cubesandbox
          - examples/ecosystem-sdk
          - examples/ecosystem/mcp
          - tests/consumer
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go test -race -mod=readonly ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  benchmarks:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test ./benchmarks -run=^$ -bench '.*' -benchtime=10x

  race:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test -race ./...

  fuzz:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test ./pkg/plugin -run=^$ -fuzz=FuzzParseManifest -fuzztime=10s
      - run: go test ./pkg/toolcall -run=^$ -fuzz=FuzzParseToolCall -fuzztime=10s
      - run: go test ./pkg/tool/jsonschema -run=^$ -fuzz=FuzzFromJSON -fuzztime=10s
      - run: go test ./pkg/policy -run=^$ -fuzz=FuzzPathChecker -fuzztime=5s

  quality:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
