name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: GOWORK=off go test ./...
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off go build ./...
