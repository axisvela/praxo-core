name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  published-consumer:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: tests/consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: tests/consumer/go.sum
      - run: go test -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - run: go build -mod=readonly ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

      - name: Verify release gate failure propagation
        shell: pwsh
        run: ./scripts/release-check.Tests.ps1

  spec-conformance:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test -count=1 ./internal/spec/... -v

  python-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python conformance/run.py
      - run: python api-snapshot.py --check
      - run: python -m unittest discover -s tests -v

  examples:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test ./...
        working-directory: examples/ecosystem-sdk
      - run: go vet ./...
        working-directory: examples/ecosystem-sdk
      - run: go build ./...
        working-directory: examples/ecosystem-sdk
      - run: go test ./...
        working-directory: examples/ecosystem/mcp
      - run: go vet ./...
        working-directory: examples/ecosystem/mcp
      - run: go build ./...
        working-directory: examples/ecosystem/mcp

  adapters:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test ./...
        working-directory: adapters/mcp
      - run: go vet ./...
        working-directory: adapters/mcp
      - run: go build ./...
        working-directory: adapters/mcp
      - run: go test ./...
        working-directory: adapters/otel
      - run: go vet ./...
        working-directory: adapters/otel
      - run: go build ./...
        working-directory: adapters/otel
      - run: go test ./...
        working-directory: adapters/anthropic
      - run: go vet ./...
        working-directory: adapters/anthropic
      - run: go build ./...
        working-directory: adapters/anthropic
      - run: go test ./...
        working-directory: adapters/gemini
      - run: go vet ./...
        working-directory: adapters/gemini
      - run: go build ./...
        working-directory: adapters/gemini
      - run: go test ./...
        working-directory: adapters/harmovela
      - run: go vet ./...
        working-directory: adapters/harmovela
      - run: go build ./...
        working-directory: adapters/harmovela
      - run: go test ./...
        working-directory: adapters/a2a
      - run: go vet ./...
        working-directory: adapters/a2a
      - run: go build ./...
        working-directory: adapters/a2a
      - run: go test ./...
        working-directory: adapters/multiagent
      - run: go vet ./...
        working-directory: adapters/multiagent
      - run: go build ./...
        working-directory: adapters/multiagent
      - run: go test ./...
        working-directory: adapters/workspace
      - run: go vet ./...
        working-directory: adapters/workspace
      - run: go build ./...
        working-directory: adapters/workspace
      - run: go test ./...
        working-directory: adapters/workspace/e2b
      - run: go vet ./...
        working-directory: adapters/workspace/e2b
      - run: go build ./...
        working-directory: adapters/workspace/e2b
      - run: go test ./...
        working-directory: adapters/workspace/daytona
      - run: go vet ./...
        working-directory: adapters/workspace/daytona
      - run: go build ./...
        working-directory: adapters/workspace/daytona
      - run: go test ./...
        working-directory: adapters/workspace/opensandbox
      - run: go vet ./...
        working-directory: adapters/workspace/opensandbox
      - run: go build ./...
        working-directory: adapters/workspace/opensandbox
      - run: go test ./...
        working-directory: adapters/workspace/cubesandbox
      - run: go vet ./...
        working-directory: adapters/workspace/cubesandbox
      - run: go build ./...
        working-directory: adapters/workspace/cubesandbox

  module-security:
    strategy:
      fail-fast: false
      matrix:
        module:
          - adapters/mcp
          - adapters/otel
          - adapters/anthropic
          - adapters/gemini
          - adapters/harmovela
          - adapters/a2a
          - adapters/multiagent
          - adapters/workspace
          - adapters/workspace/e2b
          - adapters/workspace/daytona
          - adapters/workspace/opensandbox
          - adapters/workspace/cubesandbox
          - examples/ecosystem-sdk
          - examples/ecosystem/mcp
          - tests/consumer
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go test -race -mod=readonly ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  benchmarks:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test ./benchmarks -run=^$ -bench '.*' -benchtime=10x

  race:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test -race ./...

  fuzz:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test ./pkg/plugin -run=^$ -fuzz=FuzzParseManifest -fuzztime=10s
      - run: go test ./pkg/toolcall -run=^$ -fuzz=FuzzParseToolCall -fuzztime=10s
      - run: go test ./pkg/tool/jsonschema -run=^$ -fuzz=FuzzFromJSON -fuzztime=10s
      - run: go test ./pkg/policy -run=^$ -fuzz=FuzzPathChecker -fuzztime=5s

  quality:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
