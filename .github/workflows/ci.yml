name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "language/python/**"
      - "language/typescript/**"
  pull_request:
    paths-ignore:
      - "language/python/**"
      - "language/typescript/**"
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/ci_changes.py

  current-java-consumer:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.consumers == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['21']
        include:
          - os: ubuntu-latest
            java: '23'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_java_consumer.py -v
      - run: python scripts/test_java_upgrade.py -v

  current-typescript-consumer:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.consumers == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: language/typescript/examples/consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: language/typescript/examples/consumer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node starter.js
      - run: python scripts/test_typescript_consumer.py -v
        working-directory: .
      - run: python scripts/test_typescript_upgrade.py -v
        working-directory: .

  current-python-consumer:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.consumers == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/test_python_consumer.py -v
      - run: python scripts/test_python_upgrade.py -v

  current-go-consumer:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.consumers == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: examples/consumer-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: examples/consumer-go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - run: go build -mod=readonly ./...
      - run: go run -mod=readonly .
      - run: python scripts/test_go_consumer.py
        working-directory: .
      - run: python scripts/test_go_upgrade.py -v
        working-directory: .
      - run: python scripts/test_go_longrunning.py -v
        working-directory: .
      - run: python scripts/test_go_identity.py -v
        working-directory: .
      - run: python scripts/test_go_conformance_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_retry_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_event_sink_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_context_budget_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_checkpoint_store_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_structured_output_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_vfs_containment_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_provider_fallback_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_plugin_lifecycle_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_multi_agent_recipe.py -v
        working-directory: .
      - run: python scripts/test_go_streaming_recipe.py -v
        working-directory: .

  current-ruby-consumer:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.consumers == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/ruby/examples/consumer
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: bundle install
      - run: bundle exec ruby test_starter.rb

  current-php-consumer:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.consumers == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/php/examples/consumer
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4.27"
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer test

  current-elixir-consumer:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.consumers == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/elixir/examples/consumer
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
      - run: mix deps.get
      - run: mix run test_starter.exs

  current-lua-consumer:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.consumers == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/lua/examples/consumer
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4 liblua5.4-dev luarocks
      - name: Install the rock and run outside the repository
        shell: bash
        run: |
          tree="$RUNNER_TEMP/praxo-luarocks"
          luarocks --lua-version 5.4 --tree "$tree" install praxo-core 0.4.1-1
          consumer="$RUNNER_TEMP/praxo-lua-consumer"
          mkdir -p "$consumer"
          cp starter.lua test_starter.lua "$consumer"
          cd "$consumer"
          LUA_PATH="$tree/share/lua/5.4/?.lua;$tree/share/lua/5.4/?/init.lua;;" \
            lua5.4 test_starter.lua

  published-consumer:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: tests/consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: tests/consumer/go.sum
      - run: go test -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - run: go build -mod=readonly ./...

  test:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

      - name: Verify release gate failure propagation
        shell: pwsh
        run: ./scripts/release-check.Tests.ps1

      - name: Verify API snapshot failure propagation
        shell: pwsh
        run: ./scripts/api-snapshot.Tests.ps1

      - name: Check Go public API snapshot
        shell: pwsh
        run: ./scripts/api-snapshot.ps1 -Check

  containment-linux:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: Verify platform containment controls
        run: go test -count=1 -v -timeout 10m ./pkg/policy ./pkg/vfs/localfs ./pkg/plugin/host/process ./pkg/plugin/host/wasm

  spec-conformance:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test -count=1 ./internal/spec/... -v

  privacy:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test -count=1 ./internal/spec -run 'TestNoDisallowedEmails|TestNoInternalHostnames' -v
      - run: go test -count=1 ./internal/spec -run TestGitHistoryEmails -v
        env:
          PRAXO_DISALLOWED_EMAIL_DOMAINS: ${{ secrets.PRAXO_DISALLOWED_EMAIL_DOMAINS }}

  python-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'python')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python conformance/run.py
      - run: python api-snapshot.py --check
      - run: python api-signatures.py --check
      - run: python -m unittest discover -s tests -v
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --sdist
      - name: Run installed wheel smoke
        run: |
          python -m venv "$RUNNER_TEMP/praxo-py-wheel"
          "$RUNNER_TEMP/praxo-py-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/praxo-py-wheel/bin/python" "$GITHUB_WORKSPACE/language/python/tests/installed_smoke.py"
      - name: Run installed sdist smoke
        run: |
          python -m venv "$RUNNER_TEMP/praxo-py-sdist"
          "$RUNNER_TEMP/praxo-py-sdist/bin/python" -m pip install --no-deps dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/praxo-py-sdist/bin/python" "$GITHUB_WORKSPACE/language/python/tests/installed_smoke.py"

  haskell-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'haskell')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.14.2.0"
      - run: python language/haskell/run-tests.py
      - run: cabal build --offline all
        working-directory: language/haskell

  matlab-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'matlab')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y octave
      - run: python language/matlab/run-tests.py --octave octave-cli

  octave-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'octave')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y octave
      - run: python language/octave/run-tests.py --octave octave-cli

  octave-package:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'octave')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y octave
      - run: python language/octave/build_octave_package.py
      - run: |
          version="$(cat language/octave/VERSION)"
          octave-cli --quiet --eval "pkg install '$PWD/language/octave/build/octave/praxo-core-${version}.tar.gz'; pkg load praxo-core; assert(strcmp(praxo.sdk_version(), '${version}'));"

  delphi-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'delphi')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl
      - run: python language/delphi/run-tests.py --compiler fpc

  ocaml-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'ocaml')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ocaml
      - run: python language/ocaml/run-tests.py --compiler ocamlc

  objc-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'objc')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python language/objc/run-tests.py --compiler clang

  elixir-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'elixir')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
          install-hex: false
          install-rebar: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python language/elixir/api-snapshot.py --check
      - run: mkdir -p language/elixir/build/ebin
      - run: elixirc -o language/elixir/build/ebin language/elixir/lib/praxo/*.ex language/elixir/lib/praxo/adapters/*.ex
      - run: elixir -pa language/elixir/build/ebin language/elixir/tests/run_tests.exs
      - run: elixir -pa language/elixir/build/ebin language/elixir/conformance/run.exs

  erlang-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'erlang')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          install-hex: false
          install-rebar: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python language/erlang/run-tests.py
      - run: python language/erlang/api-snapshot.py --check

  nim-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'nim')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.12"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python language/nim/api-snapshot.py --check
      - run: mkdir -p build
      - run: nim c --path:language/nim/src --hints:off --out:build/praxo-nim-conformance language/nim/conformance/run.nim
      - run: ./build/praxo-nim-conformance
      - run: nim c --path:language/nim/src --hints:off --out:build/praxo-nim-tests language/nim/tests/run_tests.nim
      - run: ./build/praxo-nim-tests

  v-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V 0.5.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.5.2 --repo vlang/v --pattern v_linux.zip --dir "$RUNNER_TEMP"
          echo "86caf9e70c3342d48ef19eb4f6c47b709f18c90ae86255520d5c29df6b482e23  $RUNNER_TEMP/v_linux.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/v_linux.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/v" >> "$GITHUB_PATH"
      - run: v version
      - run: python language/v/api-snapshot.py --check
      - run: mkdir -p build
      - run: v -o build/praxo-v-conformance language/v/conformance/run.v
      - run: ./build/praxo-v-conformance
      - run: v -o build/praxo-v-tests language/v/tests/run.v
      - run: ./build/praxo-v-tests

  lisp-bridge:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y sbcl
      - run: python bindings/lisp/test_bridge.py

  tcl-bridge:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tcl
      - run: python bindings/tcl/test_bridge.py

  typescript-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: language/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run api:check
      - run: npm run conformance
      - run: node --test tests/sdk.test.js tests/behavior.test.js tests/openaicompat.test.js tests/providers.test.js tests/api-signatures.test.js
      - name: Run installed package smoke
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          consumer="$RUNNER_TEMP/praxo-ts-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/axisvela-praxo-core-*.tgz
          cp "$GITHUB_WORKSPACE/language/typescript/tests/installed-smoke.js" .
          PRAXO_CONSUMER_ROOT="$consumer" node installed-smoke.js

  java-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -q -DskipTests test-compile
      - run: mvn -q -DskipTests package
      - run: java -cp target/classes com.axisvela.praxo.conformance.ApiSnapshot --check
      - run: java -cp target/classes com.axisvela.praxo.conformance.Run
      - run: java --add-modules jdk.httpserver -cp target/classes:target/test-classes com.axisvela.praxo.adapters.OpenAICompatibleSelfTest
      - run: java --add-modules jdk.httpserver -cp target/classes:target/test-classes com.axisvela.praxo.adapters.ProviderAdaptersSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.adapters.OtelSinkSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.agent.delegation.DelegationSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.retriever.RetrieverSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.agent.AgentConcurrencySelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.agent.AgentAuthorizationSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.agent.AgentLifecycleSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.agent.AgentGuardrailSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.agent.AgentStreamSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.jsonschema.JsonSchemaSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.checkpoint.CheckpointSelfTest
      - run: java -cp target/classes:target/test-classes com.axisvela.praxo.middleware.PiiMiddlewareSelfTest

  kotlin-sample:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -d language/java/build/classes $(find language/java/src/main/java -name '*.java')
      - run: curl -fL -o kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
      - run: unzip -q kotlin-compiler.zip
      - run: kotlinc/bin/kotlinc -cp language/java/build/classes -include-runtime -d examples/kotlin/sample.jar examples/kotlin/sample.kt
      - run: java -cp examples/kotlin/sample.jar:language/java/build/classes SampleKt

  scala-sample:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -d language/java/build/classes $(find language/java/src/main/java -name '*.java')
      - uses: VirtusLab/scala-cli-setup@main
      - run: scala-cli run examples/scala/sample.scala --classpath language/java/build/classes --server=false --jvm 21

  groovy-sample:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -d language/java/build/classes $(find language/java/src/main/java -name '*.java')
      - run: curl -fL -o groovy.zip https://archive.apache.org/dist/groovy/4.0.24/distribution/apache-groovy-binary-4.0.24.zip
      - run: unzip -q groovy.zip
      - run: groovy-4.0.24/bin/groovy -cp language/java/build/classes examples/groovy/sample.groovy

  clojure-sample:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'java')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -d language/java/build/classes $(find language/java/src/main/java -name '*.java')
      - run: sudo apt-get update && sudo apt-get install -y clojure
      - run: CLASSPATH=language/java/build/classes clojure examples/clojure/sample.clj

  opencl-sample:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'c')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd
      - run: mkdir -p build
      - run: cc -std=c11 -DCL_TARGET_OPENCL_VERSION=300 -I language/c/include -I language/c/src examples/opencl/sample.c language/c/src/json.c -lOpenCL -lm -o build/opencl-sample
      - run: ./build/opencl-sample

  prolog-bridge:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y swi-prolog
      - run: python bindings/prolog/test_bridge.py

  c-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'c')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check C public API snapshot
        run: python api-snapshot.py --check
      - run: cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/praxo-c"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - name: Install C package and run consumer
        run: |
          cmake --install build
          library="$(find "$RUNNER_TEMP/praxo-c" -name libpraxo_core.a -print -quit)"
          test -n "$library"
          cc -std=c11 -I"$RUNNER_TEMP/praxo-c/include" tests/install_consumer.c \
            "$library" -lm -o "$RUNNER_TEMP/praxo-c-consumer"
          "$RUNNER_TEMP/praxo-c-consumer"

  csharp-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'csharp')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build language/csharp/Praxo.Core/Praxo.Core.csproj -c Release
      - run: dotnet run --project language/csharp/Praxo.Conformance -c Release
      - run: dotnet run --project language/csharp/Praxo.Conformance -c Release -- --check-api
      - run: dotnet run --project language/csharp/Praxo.Tests -c Release
      - run: dotnet run --project language/csharp/samples/VbSample -c Release
      - run: dotnet run --project examples/fsharp/Praxo.FSharp.Sample.fsproj -c Release

  php-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'php')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2.35', '8.3.36', '8.4.27', '8.5.12']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: php language/php/conformance/run.php
      - run: php language/php/conformance/run.php --check-api
      - run: php language/php/tests/run.php

  php-windows-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'php')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4.27"
      - run: php language/php/conformance/run.php
      - run: php language/php/conformance/run.php --check-api
      - run: php language/php/tests/run.php

  swift-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'swift')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: language/swift
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift run praxo-conformance
      - run: python3 api-snapshot.py --check

  fortran-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'fortran')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install -y gfortran g++ cmake ninja-build
      - run: python3 language/fortran/run-tests.py

  cobol-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'cobol')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install -y gnucobol
      - run: python3 language/cobol/run-tests.py

  d-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'd')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/d
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned DMD compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.113.0 --repo dlang/dmd --pattern dmd.2.113.0.linux.tar.xz --dir "$RUNNER_TEMP/praxo-dmd"
          echo "b342ab8bd40cc0c46407692b31d7cd69661ff01da686234f426949e881727294  $RUNNER_TEMP/praxo-dmd/dmd.2.113.0.linux.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/praxo-dmd/dmd.2.113.0.linux.tar.xz" -C "$RUNNER_TEMP/praxo-dmd"
          echo "$RUNNER_TEMP/praxo-dmd/dmd2/linux/bin64" >> "$GITHUB_PATH"
      - run: mkdir -p build
      - run: dmd -i -Isource -O -release source/conformance.d -of=build/conformance
      - run: ./build/conformance
      - run: dmd -i -Isource -O -release source/tests.d -of=build/tests
      - run: ./build/tests
      - run: python3 api-snapshot.py --check

  zig-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'zig')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/zig
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"
      - run: mkdir -p build
      - run: zig build-exe src/conformance.zig -O ReleaseSafe -femit-bin=build/conformance
      - run: ./build/conformance
      - run: zig test src/toolcall.zig
      - run: zig test src/jsonschema.zig
      - run: zig test src/plugin.zig
      - run: zig test src/pii_test.zig
      - run: zig test src/openaicompat_test.zig
      - run: python3 api-snapshot.py --check

  dart-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'dart')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart run conformance/run.dart
      - run: python3 api-snapshot.py --check
      - run: dart run test/run.dart

  javascript-sample:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'typescript')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: node ../../examples/javascript/sample.mjs

  lua-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'lua')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4 liblua5.4-dev lua-dkjson luarocks
      - run: lua5.4 language/lua/conformance/run.lua
      - run: python3 language/lua/api-snapshot.py --check
      - run: lua5.4 language/lua/tests/run.lua
      - name: Verify installed rock
        shell: bash
        run: |
          version="$(cat language/lua/VERSION)"
          tree="$RUNNER_TEMP/praxo-lua-tree"
          luarocks --lua-version 5.4 --tree "$tree" make --deps-mode=none "language/lua/praxo-core-${version}-1.rockspec"
          LUA_PATH="$tree/share/lua/5.4/?.lua;$tree/share/lua/5.4/?/init.lua;;" \
            lua5.4 language/lua/tests/installed_smoke.lua

  ruby-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'ruby')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: ruby language/ruby/conformance/run.rb
      - run: ruby language/ruby/api-snapshot.rb --check
      - run: ruby language/ruby/tests/run.rb

  cpp-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'cpp')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S language/cpp -B language/cpp/build
      - run: cmake --build language/cpp/build
      - run: ctest --test-dir language/cpp/build --output-on-failure
      - run: python3 language/cpp/api-snapshot.py --check

  perl-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'perl')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: perl language/perl/conformance/run.pl
      - run: perl language/perl/api-snapshot.pl --check
      - run: perl language/perl/tests/run.pl

  julia-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'julia')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - run: julia --project=language/julia -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=language/julia language/julia/conformance/run.jl
      - run: julia --project=language/julia language/julia/api-snapshot.jl --check
      - run: julia --project=language/julia language/julia/test/runtests.jl

  r-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'r')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - run: Rscript language/r/conformance/run.R
      - run: Rscript language/r/api-snapshot.R --check
      - run: Rscript language/r/tests/run_tests.R

  bridge:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test ./internal/bridge ./cmd/praxo-bridge
      - run: go run ./cmd/praxo-bridge version
      - run: bash bindings/shell/praxo-bridge.sh version
      - run: pwsh -NoProfile -Command "Import-Module ./bindings/powershell/praxo-core-ps-br/praxo-core-ps-br.psm1; Invoke-PraxoBridge -Arguments @('version')"

  powershell-core:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'powershell')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build language/csharp/Praxo.Core/Praxo.Core.csproj -c Release
      - run: dotnet run --project language/csharp/Praxo.Conformance -c Release
      - run: dotnet run --project language/csharp/Praxo.Tests -c Release
      - run: pwsh -NoProfile -File language/powershell/tests/run.ps1
      - run: pwsh -NoProfile -File language/powershell/api-snapshot.ps1 -Check

  rust-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'rust')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo test
      - run: cargo run --quiet --bin conformance
      - run: python api-snapshot.py --check
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  compatibility-lab:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: language/typescript/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update
      - run: sudo apt-get install -y gfortran gnucobol g++ cmake ninja-build
      - run: python -m unittest discover -s scripts -p "test_compatibility_lab.py" -v
      - run: python scripts/compatibility_lab.py --install --strict --timeout 1200 --languages python,typescript,java,rust,fortran,cobol
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-lab-report
          path: build/compatibility-lab
          if-no-files-found: warn

  behavior-lab:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: language/typescript/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
          install-hex: false
          install-rebar: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4.27"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: sudo apt-get update
      - run: sudo apt-get install -y gfortran gnucobol g++ cmake ninja-build lua5.4 r-base
      - run: python -m unittest discover -s scripts -p "test_behavior_lab.py" -v
      - run: npm ci
        working-directory: language/typescript
      - run: npm run build
        working-directory: language/typescript
      - run: mvn -q -DskipTests test-compile
        working-directory: language/java
      - run: cmake -S language/cpp -B language/cpp/build
      - run: cmake --build language/cpp/build
      - run: cmake -S language/c -B language/c/build
      - run: cmake --build language/c/build
      - run: python scripts/behavior_lab.py --strict --timeout 600 --languages go,python,typescript,java,rust,fortran,cobol,ruby,elixir,erlang,cpp,php,csharp,lua,r,c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behavior-lab-report
          path: build/behavior-lab
          if-no-files-found: warn

  examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test ./...
        working-directory: examples/ecosystem-sdk
      - run: go vet ./...
        working-directory: examples/ecosystem-sdk
      - run: go build ./...
        working-directory: examples/ecosystem-sdk
      - run: go test ./...
        working-directory: examples/ecosystem/mcp
      - run: go vet ./...
        working-directory: examples/ecosystem/mcp
      - run: go build ./...
        working-directory: examples/ecosystem/mcp
      - run: go test ./...
        working-directory: examples/workspace-agent
      - run: go vet ./...
        working-directory: examples/workspace-agent
      - run: go test ./...
        working-directory: examples/embedded-service
      - run: go vet ./...
        working-directory: examples/embedded-service
      - run: go test ./...
        working-directory: examples/live-model/go
      - run: go vet ./...
        working-directory: examples/live-model/go

  example-sdks:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: python -m pip install -r requirements.txt
        working-directory: language/python/examples/mcp
      - run: python -m unittest test_client.py -v
        working-directory: language/python/examples/mcp
      - run: python -m pip install -r requirements.txt
        working-directory: language/python/examples/structured-output
      - run: python -m unittest test_summarize.py -v
        working-directory: language/python/examples/structured-output
      - run: npm ci --no-audit --no-fund
        working-directory: language/typescript/examples/mcp
      - run: npm test
        working-directory: language/typescript/examples/mcp
      - run: npm ci --no-audit --no-fund
        working-directory: language/typescript/examples/structured-output
      - run: npm test
        working-directory: language/typescript/examples/structured-output
      - run: dotnet run --project language/csharp/examples/mcp/Mcp.csproj -- --test
      - run: dotnet run --project language/csharp/examples/structured-output/StructuredOutput.csproj -- --test

  adapters:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.adapters == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test ./...
        working-directory: adapters/mcp
      - run: go vet ./...
        working-directory: adapters/mcp
      - run: go build ./...
        working-directory: adapters/mcp
      - run: go test ./...
        working-directory: adapters/otel
      - run: go vet ./...
        working-directory: adapters/otel
      - run: go build ./...
        working-directory: adapters/otel
      - run: go test ./...
        working-directory: adapters/anthropic
      - run: go vet ./...
        working-directory: adapters/anthropic
      - run: go build ./...
        working-directory: adapters/anthropic
      - run: go test ./...
        working-directory: adapters/gemini
      - run: go vet ./...
        working-directory: adapters/gemini
      - run: go build ./...
        working-directory: adapters/gemini
      - run: go test ./...
        working-directory: adapters/harmovela
      - run: go vet ./...
        working-directory: adapters/harmovela
      - run: go build ./...
        working-directory: adapters/harmovela
      - run: go test ./...
        working-directory: adapters/a2a
      - run: go vet ./...
        working-directory: adapters/a2a
      - run: go build ./...
        working-directory: adapters/a2a
