name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  published-consumer:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: tests/consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: tests/consumer/go.sum
      - run: go test -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - run: go build -mod=readonly ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

      - name: Verify release gate failure propagation
        shell: pwsh
        run: ./scripts/release-check.Tests.ps1

      - name: Verify API snapshot failure propagation
        shell: pwsh
        run: ./scripts/api-snapshot.Tests.ps1

      - name: Check Go public API snapshot
        shell: pwsh
        run: ./scripts/api-snapshot.ps1 -Check

  containment-linux:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Verify platform containment controls
        run: go test -count=1 -v -timeout 10m ./pkg/policy ./pkg/vfs/localfs ./pkg/plugin/host/process ./pkg/plugin/host/wasm

  spec-conformance:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test -count=1 ./internal/spec/... -v

  privacy:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test -count=1 ./internal/spec -run 'TestNoDisallowedEmails|TestNoInternalHostnames' -v
      - run: go test -count=1 ./internal/spec -run TestGitHistoryEmails -v
        env:
          PRAXO_DISALLOWED_EMAIL_DOMAINS: ${{ secrets.PRAXO_DISALLOWED_EMAIL_DOMAINS }}

  python-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python conformance/run.py
      - run: python api-snapshot.py --check
      - run: python api-signatures.py --check
      - run: python -m unittest discover -s tests -v
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --sdist
      - name: Run installed wheel smoke
        run: |
          python -m venv "$RUNNER_TEMP/praxo-py-wheel"
          "$RUNNER_TEMP/praxo-py-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/praxo-py-wheel/bin/python" "$GITHUB_WORKSPACE/language/python/tests/installed_smoke.py"
      - name: Run installed sdist smoke
        run: |
          python -m venv "$RUNNER_TEMP/praxo-py-sdist"
          "$RUNNER_TEMP/praxo-py-sdist/bin/python" -m pip install --no-deps dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/praxo-py-sdist/bin/python" "$GITHUB_WORKSPACE/language/python/tests/installed_smoke.py"

  haskell-conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.14.2.0"
      - run: python language/haskell/run-tests.py
      - run: cabal build --offline all
        working-directory: language/haskell

  matlab-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y octave
      - run: python language/matlab/run-tests.py --octave octave-cli

  delphi-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl
      - run: python language/delphi/run-tests.py --compiler fpc

  ocaml-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ocaml
      - run: python language/ocaml/run-tests.py --compiler ocamlc

  objc-conformance:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python language/objc/run-tests.py --compiler clang

  elixir-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python language/elixir/api-snapshot.py --check
      - run: mkdir -p language/elixir/build/ebin
      - run: elixirc -o language/elixir/build/ebin language/elixir/lib/praxo/*.ex
      - run: elixir -pa language/elixir/build/ebin language/elixir/tests/run_tests.exs
      - run: elixir -pa language/elixir/build/ebin language/elixir/conformance/run.exs

  erlang-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python language/erlang/run-tests.py
      - run: python language/erlang/api-snapshot.py --check

  nim-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.12"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python language/nim/api-snapshot.py --check
      - run: mkdir -p build
      - run: nim c --path:language/nim/src --hints:off --out:build/praxo-nim-conformance language/nim/conformance/run.nim
      - run: ./build/praxo-nim-conformance
      - run: nim c --path:language/nim/src --hints:off --out:build/praxo-nim-tests language/nim/tests/run_tests.nim
      - run: ./build/praxo-nim-tests

  v-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V 0.5.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.5.2 --repo vlang/v --pattern v_linux.zip --dir "$RUNNER_TEMP"
          echo "86caf9e70c3342d48ef19eb4f6c47b709f18c90ae86255520d5c29df6b482e23  $RUNNER_TEMP/v_linux.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/v_linux.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/v" >> "$GITHUB_PATH"
      - run: v version
      - run: python language/v/api-snapshot.py --check
      - run: mkdir -p build
      - run: v -o build/praxo-v-conformance language/v/conformance/run.v
      - run: ./build/praxo-v-conformance
      - run: v -o build/praxo-v-tests language/v/tests/run.v
      - run: ./build/praxo-v-tests

  lisp-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y sbcl
      - run: python bindings/lisp/test_bridge.py

  tcl-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tcl
      - run: python bindings/tcl/test_bridge.py

  typescript-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: language/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run api:check
      - run: npm run conformance
      - run: node --test tests/sdk.test.js tests/openaicompat.test.js tests/api-signatures.test.js
      - name: Run installed package smoke
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          consumer="$RUNNER_TEMP/praxo-ts-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/axisvela-praxo-core-*.tgz
          cp "$GITHUB_WORKSPACE/language/typescript/tests/installed-smoke.js" .
          PRAXO_CONSUMER_ROOT="$consumer" node installed-smoke.js

  java-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -q -DskipTests test-compile
      - run: mvn -q -DskipTests package
      - run: java -cp target/classes io.axisvela.praxo.conformance.ApiSnapshot --check
      - run: java -cp target/classes io.axisvela.praxo.conformance.Run
      - run: java --add-modules jdk.httpserver -cp target/classes:target/test-classes io.axisvela.praxo.adapters.OpenAICompatibleSelfTest
      - run: java -cp target/classes:target/test-classes io.axisvela.praxo.agent.AgentConcurrencySelfTest
      - run: java -cp target/classes:target/test-classes io.axisvela.praxo.middleware.PiiMiddlewareSelfTest

  kotlin-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -d language/java/build/classes $(find language/java/src/main/java -name '*.java')
      - run: curl -fL -o kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
      - run: unzip -q kotlin-compiler.zip
      - run: kotlinc/bin/kotlinc -cp language/java/build/classes -include-runtime -d examples/kotlin/sample.jar examples/kotlin/sample.kt
      - run: java -cp examples/kotlin/sample.jar:language/java/build/classes SampleKt

  scala-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -d language/java/build/classes $(find language/java/src/main/java -name '*.java')
      - uses: VirtusLab/scala-cli-setup@main
      - run: scala-cli run examples/scala/sample.scala --classpath language/java/build/classes --server=false --jvm 21

  groovy-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -d language/java/build/classes $(find language/java/src/main/java -name '*.java')
      - run: curl -fL -o groovy.zip https://archive.apache.org/dist/groovy/4.0.24/distribution/apache-groovy-binary-4.0.24.zip
      - run: unzip -q groovy.zip
      - run: groovy-4.0.24/bin/groovy -cp language/java/build/classes examples/groovy/sample.groovy

  clojure-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: javac -d language/java/build/classes $(find language/java/src/main/java -name '*.java')
      - run: sudo apt-get update && sudo apt-get install -y clojure
      - run: CLASSPATH=language/java/build/classes clojure examples/clojure/sample.clj

  opencl-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd
      - run: mkdir -p build
      - run: cc -std=c11 -DCL_TARGET_OPENCL_VERSION=300 -I language/c/include -I language/c/src examples/opencl/sample.c language/c/src/json.c -lOpenCL -lm -o build/opencl-sample
      - run: ./build/opencl-sample

  prolog-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y swi-prolog
      - run: python bindings/prolog/test_bridge.py

  c-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check C public API snapshot
        run: python api-snapshot.py --check
      - run: cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/praxo-c"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - name: Install C package and run consumer
        run: |
          cmake --install build
          library="$(find "$RUNNER_TEMP/praxo-c" -name libpraxo_core.a -print -quit)"
          test -n "$library"
          cc -std=c11 -I"$RUNNER_TEMP/praxo-c/include" tests/install_consumer.c \
            "$library" -lm -o "$RUNNER_TEMP/praxo-c-consumer"
          "$RUNNER_TEMP/praxo-c-consumer"

  csharp-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build language/csharp/Praxo.Core/Praxo.Core.csproj -c Release
      - run: dotnet run --project language/csharp/Praxo.Conformance -c Release
      - run: dotnet run --project language/csharp/Praxo.Conformance -c Release -- --check-api
      - run: dotnet run --project language/csharp/Praxo.Tests -c Release
      - run: dotnet run --project language/csharp/samples/VbSample -c Release
      - run: dotnet run --project examples/fsharp/Praxo.FSharp.Sample.fsproj -c Release

  php-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: php language/php/conformance/run.php
      - run: php language/php/conformance/run.php --check-api
      - run: php language/php/tests/run.php

  swift-conformance:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: language/swift
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift run praxo-conformance
      - run: python3 api-snapshot.py --check

  fortran-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install -y gfortran
      - run: python3 language/fortran/run-tests.py

  cobol-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install -y gnucobol
      - run: python3 language/cobol/run-tests.py

  d-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/d
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned DMD compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.113.0 --repo dlang/dmd --pattern dmd.2.113.0.linux.tar.xz --dir "$RUNNER_TEMP/praxo-dmd"
          echo "b342ab8bd40cc0c46407692b31d7cd69661ff01da686234f426949e881727294  $RUNNER_TEMP/praxo-dmd/dmd.2.113.0.linux.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/praxo-dmd/dmd.2.113.0.linux.tar.xz" -C "$RUNNER_TEMP/praxo-dmd"
          echo "$RUNNER_TEMP/praxo-dmd/dmd2/linux/bin64" >> "$GITHUB_PATH"
      - run: mkdir -p build
      - run: dmd -i -Isource -O -release source/conformance.d -of=build/conformance
      - run: ./build/conformance
      - run: dmd -i -Isource -O -release source/tests.d -of=build/tests
      - run: ./build/tests
      - run: python3 api-snapshot.py --check

  zig-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/zig
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"
      - run: mkdir -p build
      - run: zig build-exe src/conformance.zig -O ReleaseSafe -femit-bin=build/conformance
      - run: ./build/conformance
      - run: zig test src/toolcall.zig
      - run: zig test src/jsonschema.zig
      - run: zig test src/plugin.zig
      - run: zig test src/pii_test.zig
      - run: python3 api-snapshot.py --check

  dart-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart run conformance/run.dart
      - run: python3 api-snapshot.py --check
      - run: dart run tests/run.dart

  javascript-sample:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: node ../../examples/javascript/sample.mjs

  lua-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 language/lua/conformance/run.lua
      - run: python3 language/lua/api-snapshot.py --check
      - run: lua5.4 language/lua/tests/run.lua

  ruby-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: ruby language/ruby/conformance/run.rb
      - run: ruby language/ruby/api-snapshot.rb --check
      - run: ruby language/ruby/tests/run.rb

  cpp-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S language/cpp -B language/cpp/build
      - run: cmake --build language/cpp/build
      - run: ctest --test-dir language/cpp/build --output-on-failure
      - run: python3 language/cpp/api-snapshot.py --check

  perl-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: perl language/perl/conformance/run.pl
      - run: perl language/perl/api-snapshot.pl --check
      - run: perl language/perl/tests/run.pl

  julia-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - run: julia --project=language/julia -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=language/julia language/julia/conformance/run.jl
      - run: julia --project=language/julia language/julia/api-snapshot.jl --check
      - run: julia --project=language/julia language/julia/test/runtests.jl

  r-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - run: Rscript language/r/conformance/run.R
      - run: Rscript language/r/api-snapshot.R --check
      - run: Rscript language/r/tests/run_tests.R

  bridge:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: go test ./internal/bridge ./cmd/praxo-bridge
      - run: go run ./cmd/praxo-bridge version
      - run: bash bindings/shell/praxo-bridge.sh version
      - run: pwsh -NoProfile -Command "Import-Module ./bindings/powershell/PraxoBridge.psm1; Invoke-PraxoBridge -Arguments @('version')"

  rust-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo test
      - run: cargo run --quiet --bin conformance
      - run: python api-snapshot.py --check
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  compatibility-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: language/typescript/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m unittest discover -s scripts -p "test_compatibility_lab.py" -v
      - run: python scripts/compatibility_lab.py --install --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-lab-report
          path: build/compatibility-lab
          if-no-files-found: warn

