name: ci-applications

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - "language/cobol/**"
      - "language/cpp/**"
      - "language/elixir/**"
      - "language/erlang/**"
      - "language/go/**"
      - "language/java/**"
      - "language/julia/**"
      - "language/php/**"
      - "language/ruby/**"
      - "language/rust/**"
      - ".github/workflows/ci-applications.yml"
      - "!scripts/check_adapter_status.py"
      - "!scripts/check_consumer_pins.py"
      - "!scripts/check_language_releases.py"
      - "!scripts/check_registry_pages.py"
      - "!scripts/check_registry_state.py"
      - "!scripts/docs_hooks.py"
      - "!scripts/mirror_readme.py"
      - "!scripts/registry_catalog.py"
      - "!scripts/registry_discovery.py"
      - "!scripts/repository_discovery.py"
      - "!scripts/sync_language_mirrors.py"
      - "!scripts/sync_language_registry_docs.py"
      - "!scripts/test_adapter_status.py"
      - "!scripts/test_consumer_pins.py"
      - "!scripts/test_discovery.py"
      - "!scripts/test_docs.py"
      - "!scripts/test_language_registry_docs.py"
      - "!scripts/test_language_releases.py"
      - "!scripts/test_layout.py"
      - "!scripts/test_registry_pages.py"
      - "!scripts/test_registry_state.py"
      - "!scripts/test_roadmap.py"
      - "!scripts/test_sync_language_mirrors.py"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
  pull_request:
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - "language/cobol/**"
      - "language/cpp/**"
      - "language/elixir/**"
      - "language/erlang/**"
      - "language/go/**"
      - "language/java/**"
      - "language/julia/**"
      - "language/php/**"
      - "language/ruby/**"
      - "language/rust/**"
      - ".github/workflows/ci-applications.yml"
      - "!scripts/check_adapter_status.py"
      - "!scripts/check_consumer_pins.py"
      - "!scripts/check_language_releases.py"
      - "!scripts/check_registry_pages.py"
      - "!scripts/check_registry_state.py"
      - "!scripts/docs_hooks.py"
      - "!scripts/mirror_readme.py"
      - "!scripts/registry_catalog.py"
      - "!scripts/registry_discovery.py"
      - "!scripts/repository_discovery.py"
      - "!scripts/sync_language_mirrors.py"
      - "!scripts/sync_language_registry_docs.py"
      - "!scripts/test_adapter_status.py"
      - "!scripts/test_consumer_pins.py"
      - "!scripts/test_discovery.py"
      - "!scripts/test_docs.py"
      - "!scripts/test_language_registry_docs.py"
      - "!scripts/test_language_releases.py"
      - "!scripts/test_layout.py"
      - "!scripts/test_registry_pages.py"
      - "!scripts/test_registry_state.py"
      - "!scripts/test_roadmap.py"
      - "!scripts/test_sync_language_mirrors.py"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-applications.yml
        run: python scripts/ci_changes.py

  php-reference-applications:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.applications), 'php')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [content-review, ai-editorial-studio]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, curl, fileinfo, intl, pdo_sqlite
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: language/php/application/${{ matrix.app }}
      - run: vendor/bin/phpunit
        working-directory: language/php/application/${{ matrix.app }}

  java-ai-commerce:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.applications), 'java')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -DskipTests package
        working-directory: language/java/application
      - run: mvn -B -ntp test
        working-directory: language/java/application

  elixir-ai-ops:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.applications), 'elixir')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20.4'
      - run: mix deps.get
        working-directory: language/elixir/application
      - run: mix test
        working-directory: language/elixir/application

  erlang-ai-ops:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.applications), 'erlang')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python language/erlang/application/run-tests.py

  go-ai-ops:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.applications), 'go') || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - run: go test ./...
        working-directory: language/go/application

  rust-ai-ops:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.applications), 'rust')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: language/rust/application

  cpp-ai-edge-application:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.applications), 'cpp')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S language/cpp -B language/cpp/build-ai-edge
      - run: cmake --build language/cpp/build-ai-edge --target praxo-cpp-ai-edge-application
      - run: test -f language/cpp/build-ai-edge/libpraxo-cpp-ai-edge-application.a

  ruby-ai-commerce:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.applications), 'ruby')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: gem install railties actionpack rack tzinfo-data --no-document
      - run: ruby -I language/ruby/lib language/ruby/application/run-tests.rb

  cobol-batch-analyst:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.applications), 'cobol')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gnucobol
      - run: python language/cobol/application/run-tests.py

  julia-ai-science:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.applications), 'julia')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - run: julia --project=language/julia -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=language/julia language/julia/application/application.jl --test
