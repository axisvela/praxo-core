name: ci-additional3

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - "language/haskell/**"
      - "language/julia/**"
      - "language/nim/**"
      - "language/objc/**"
      - "language/ocaml/**"
      - "language/swift/**"
      - "language/v/**"
      - "language/zig/**"
      - ".github/workflows/ci-additional3.yml"
      - "!scripts/check_adapter_status.py"
      - "!scripts/check_consumer_pins.py"
      - "!scripts/check_language_releases.py"
      - "!scripts/check_registry_pages.py"
      - "!scripts/check_registry_state.py"
      - "!scripts/docs_hooks.py"
      - "!scripts/mirror_readme.py"
      - "!scripts/registry_catalog.py"
      - "!scripts/registry_discovery.py"
      - "!scripts/repository_discovery.py"
      - "!scripts/sync_language_mirrors.py"
      - "!scripts/sync_language_registry_docs.py"
      - "!scripts/test_adapter_status.py"
      - "!scripts/test_consumer_pins.py"
      - "!scripts/test_discovery.py"
      - "!scripts/test_docs.py"
      - "!scripts/test_language_registry_docs.py"
      - "!scripts/test_language_releases.py"
      - "!scripts/test_layout.py"
      - "!scripts/test_registry_pages.py"
      - "!scripts/test_registry_state.py"
      - "!scripts/test_roadmap.py"
      - "!scripts/test_sync_language_mirrors.py"
      - "!scripts/check_ci_workflow_coverage.py"
      - "!scripts/ci_changes.py"
      - "!scripts/sync_ci_routing.py"
      - "!scripts/test_ci_changes.py"
      - "!scripts/test_ci_execution.py"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
      - "!scripts/build_php_package.py"
      - "!scripts/test_php_package.py"
  pull_request:
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - "language/haskell/**"
      - "language/julia/**"
      - "language/nim/**"
      - "language/objc/**"
      - "language/ocaml/**"
      - "language/swift/**"
      - "language/v/**"
      - "language/zig/**"
      - ".github/workflows/ci-additional3.yml"
      - "!scripts/check_adapter_status.py"
      - "!scripts/check_consumer_pins.py"
      - "!scripts/check_language_releases.py"
      - "!scripts/check_registry_pages.py"
      - "!scripts/check_registry_state.py"
      - "!scripts/docs_hooks.py"
      - "!scripts/mirror_readme.py"
      - "!scripts/registry_catalog.py"
      - "!scripts/registry_discovery.py"
      - "!scripts/repository_discovery.py"
      - "!scripts/sync_language_mirrors.py"
      - "!scripts/sync_language_registry_docs.py"
      - "!scripts/test_adapter_status.py"
      - "!scripts/test_consumer_pins.py"
      - "!scripts/test_discovery.py"
      - "!scripts/test_docs.py"
      - "!scripts/test_language_registry_docs.py"
      - "!scripts/test_language_releases.py"
      - "!scripts/test_layout.py"
      - "!scripts/test_registry_pages.py"
      - "!scripts/test_registry_state.py"
      - "!scripts/test_roadmap.py"
      - "!scripts/test_sync_language_mirrors.py"
      - "!scripts/check_ci_workflow_coverage.py"
      - "!scripts/ci_changes.py"
      - "!scripts/sync_ci_routing.py"
      - "!scripts/test_ci_changes.py"
      - "!scripts/test_ci_execution.py"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
      - "!scripts/build_php_package.py"
      - "!scripts/test_php_package.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-additional3.yml
        run: python scripts/ci_changes.py

  swift-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'swift')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift run --package-path language/swift praxo-retry-example
      - run: swift run --package-path language/swift praxo-checkpoint-example
      - run: swift run --package-path language/swift praxo-event-sink-example
      - run: swift run --package-path language/swift praxo-provider-fallback-example
      - run: swift run --package-path language/swift praxo-structured-output-example
      - run: swift run --package-path language/swift praxo-streaming-example
      - run: swift run --package-path language/swift praxo-identity-policy-example
      - run: swift run --package-path language/swift praxo-service-example
      - run: swift run --package-path language/swift praxo-mcp-example
      - run: swift run --package-path language/swift praxo-hitl-example
      - run: swift run --package-path language/swift praxo-consumer-example

  julia-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'julia')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13.2"
      - run: julia --project=language/julia -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=language/julia language/julia/examples/retry/retry.jl
      - run: julia --project=language/julia language/julia/examples/checkpoint/checkpoint.jl
      - run: julia --project=language/julia language/julia/examples/event-sink/event_sink.jl
      - run: julia --project=language/julia language/julia/examples/provider-fallback/fallback.jl
      - run: julia --project=language/julia language/julia/examples/structured-output/structured_output.jl
      - run: julia --project=language/julia language/julia/examples/streaming/streaming.jl
      - run: julia --project=language/julia language/julia/examples/identity-policy/identity_policy.jl
      - run: julia --project=language/julia language/julia/examples/service/service.jl
      - run: julia --project=language/julia language/julia/examples/mcp/mcp.jl
      - run: julia --project=language/julia language/julia/examples/session-checkpoint/session_checkpoint.jl
      - run: julia --project=language/julia language/julia/examples/hitl/starter.jl
      - run: julia --project=language/julia language/julia/examples/hitl/test_starter.jl

  haskell-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'haskell')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
      - run: runghc -ilanguage/haskell/src language/haskell/examples/retry/retry.hs
      - run: runghc -ilanguage/haskell/src language/haskell/examples/checkpoint/checkpoint.hs
      - run: runghc -ilanguage/haskell/src language/haskell/examples/event-sink/event_sink.hs
      - run: runghc -ilanguage/haskell/src language/haskell/examples/provider-fallback/fallback.hs
      - run: runghc -ilanguage/haskell/src language/haskell/examples/structured-output/structured_output.hs
      - run: runghc -ilanguage/haskell/src language/haskell/examples/streaming/streaming.hs
      - run: runghc -ilanguage/haskell/src language/haskell/examples/identity-policy/identity_policy.hs
      - run: runghc -ilanguage/haskell/src language/haskell/examples/service/service.hs
      - run: runghc -ilanguage/haskell/src language/haskell/examples/mcp/mcp.hs
      - run: runghc -ilanguage/haskell/src language/haskell/examples/session-checkpoint/session_checkpoint.hs
      - run: runghc -ilanguage/haskell/src -ilanguage/haskell/examples/hitl language/haskell/examples/hitl/starter.hs
      - run: runghc -ilanguage/haskell/src -ilanguage/haskell/examples/hitl language/haskell/examples/hitl/test_starter.hs

  ocaml-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'ocaml')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"
      - run: opam exec -- ocaml unix.cma -I language/ocaml/src language/ocaml/examples/retry/retry.ml
      - run: opam exec -- ocaml unix.cma -I language/ocaml/src language/ocaml/examples/checkpoint/checkpoint.ml
      - run: opam exec -- ocaml unix.cma -I language/ocaml/src language/ocaml/examples/event-sink/event_sink.ml
      - run: opam exec -- ocaml unix.cma -I language/ocaml/src language/ocaml/examples/provider-fallback/fallback.ml
      - run: opam exec -- ocaml unix.cma -I language/ocaml/src language/ocaml/examples/structured-output/structured_output.ml
      - run: opam exec -- ocaml unix.cma -I language/ocaml/src language/ocaml/examples/streaming/streaming.ml
      - run: opam exec -- ocaml unix.cma -I language/ocaml/src language/ocaml/examples/identity-policy/identity_policy.ml
      - run: opam exec -- ocaml unix.cma -I language/ocaml/src language/ocaml/examples/service/service.ml
      - run: opam exec -- ocaml unix.cma -I language/ocaml/src language/ocaml/examples/mcp/mcp.ml
      - run: opam exec -- ocaml unix.cma -I language/ocaml/src language/ocaml/examples/session-checkpoint/session_checkpoint.ml
      - run: opam exec -- ocaml unix.cma -I language/ocaml/src language/ocaml/examples/hitl/hitl.ml

  nim-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'nim')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.0.0"
      - run: nim r --path:language/nim/src language/nim/examples/retry/retry.nim
      - run: nim r --path:language/nim/src language/nim/examples/checkpoint/checkpoint.nim
      - run: nim r --path:language/nim/src language/nim/examples/event-sink/event_sink.nim
      - run: nim r --path:language/nim/src language/nim/examples/provider-fallback/fallback.nim
      - run: nim r --path:language/nim/src language/nim/examples/structured-output/structured_output.nim
      - run: nim r --path:language/nim/src language/nim/examples/streaming/streaming.nim
      - run: nim r --path:language/nim/src language/nim/examples/identity-policy/identity_policy.nim
      - run: nim r --path:language/nim/src language/nim/examples/service/service.nim
      - run: nim r --path:language/nim/src language/nim/examples/mcp/mcp.nim
      - run: nim r --path:language/nim/src language/nim/examples/session-checkpoint/session_checkpoint.nim
      - run: nim r --path:language/nim/src language/nim/examples/session-checkpoint/test_session_checkpoint.nim
      - run: nim r --path:language/nim/src language/nim/examples/hitl/starter.nim
      - run: nim r --path:language/nim/src language/nim/examples/hitl/test_starter.nim

  v-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install V 0.5.2
        run: |
          curl -L -o v_linux.zip https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip
          echo '86caf9e70c3342d48ef19eb4f6c47b709f18c90ae86255520d5c29df6b482e23  v_linux.zip' | sha256sum --check
          unzip -q v_linux.zip
          curl -L -o v-src.zip https://codeload.github.com/vlang/v/zip/refs/tags/0.5.2
          unzip -q v-src.zip
          cp -R v-0.5.2/vlib/x/json2 v/vlib/x/json2
          echo "VROOT=$PWD/v" >> "$GITHUB_ENV"
          echo "$PWD/v" >> "$GITHUB_PATH"
      - run: v version
      - run: v -path "language/v|@vlib|@vmodules" language/v/examples/retry/retry.v
      - run: v -path "language/v|@vlib|@vmodules" language/v/examples/checkpoint/checkpoint.v
      - run: v -path "language/v|@vlib|@vmodules" language/v/examples/event-sink/event_sink.v
      - run: v -path "language/v|@vlib|@vmodules" language/v/examples/provider-fallback/fallback.v
      - run: v -path "language/v|@vlib|@vmodules" language/v/examples/structured-output/structured_output.v
      - run: v -path "language/v|@vlib|@vmodules" language/v/examples/streaming/streaming.v
      - run: v -path "language/v|@vlib|@vmodules" language/v/examples/identity-policy/identity_policy.v
      - run: v -path "language/v|@vlib|@vmodules" language/v/examples/service/service.v
      - run: v -path "language/v|@vlib|@vmodules" language/v/examples/mcp/mcp.v
      - run: v -path "language/v|@vlib|@vmodules" language/v/examples/session-checkpoint/starter.v
      - run: v -path "language/v|@vlib|@vmodules" language/v/examples/hitl/hitl.v

  zig-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'zig')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"
      - run: mkdir -p build
      - run: zig run language/zig/examples/retry/retry.zig
      - run: zig build-exe --dep praxo -Mroot=language/zig/examples/checkpoint/checkpoint.zig -Mpraxo=language/zig/src/praxo.zig -femit-bin=build/zig-checkpoint
      - run: ./build/zig-checkpoint
      - run: zig build-exe --dep praxo -Mroot=language/zig/examples/event-sink/event_sink.zig -Mpraxo=language/zig/src/praxo.zig -femit-bin=build/zig-event-sink
      - run: ./build/zig-event-sink
      - run: zig run language/zig/examples/provider-fallback/fallback.zig
      - run: zig build-exe --dep praxo -Mroot=language/zig/examples/structured-output/structured_output.zig -Mpraxo=language/zig/src/praxo.zig -femit-bin=build/zig-structured-output
      - run: ./build/zig-structured-output
      - run: zig run language/zig/examples/streaming/streaming.zig
      - run: zig run language/zig/examples/identity-policy/identity_policy.zig
      - run: zig run language/zig/examples/service/service.zig
      - run: zig build-exe --dep praxo -Mroot=language/zig/examples/mcp/mcp.zig -Mpraxo=language/zig/src/praxo.zig -femit-bin=build/zig-mcp
      - run: ./build/zig-mcp
      - run: zig run --dep praxo -Mroot=language/zig/examples/session-checkpoint/starter.zig -Mpraxo=language/zig/src/praxo.zig
      - run: zig run --dep praxo -Mroot=language/zig/examples/hitl/hitl.zig -Mpraxo=language/zig/src/praxo.zig
      - run: zig test --dep praxo -Mroot=language/zig/examples/hitl/hitl_test.zig -Mpraxo=language/zig/src/praxo.zig

  objc-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'objc')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p build
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-retry language/objc/examples/retry/retry.m -framework Foundation
      - run: ./build/objc-retry
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-checkpoint language/objc/examples/checkpoint/checkpoint.m language/objc/src/PraxoCore.m language/objc/src/PraxoJSON.m -framework Foundation
      - run: ./build/objc-checkpoint
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-event-sink language/objc/examples/event-sink/event_sink.m language/objc/src/PraxoCore.m language/objc/src/PraxoJSON.m -framework Foundation
      - run: ./build/objc-event-sink
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-provider-fallback language/objc/examples/provider-fallback/fallback.m -framework Foundation
      - run: ./build/objc-provider-fallback
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-structured-output language/objc/examples/structured-output/structured_output.m language/objc/src/PraxoJsonSchema.m language/objc/src/PraxoJSON.m -framework Foundation
      - run: ./build/objc-structured-output
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-streaming language/objc/examples/streaming/streaming.m -framework Foundation
      - run: ./build/objc-streaming
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-identity-policy language/objc/examples/identity-policy/identity_policy.m -framework Foundation
      - run: ./build/objc-identity-policy
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-service language/objc/examples/service/service.m -framework Foundation
      - run: ./build/objc-service
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-mcp language/objc/examples/mcp/mcp.m language/objc/src/PraxoMCP.m language/objc/src/PraxoCore.m language/objc/src/PraxoJSON.m -framework Foundation
      - run: ./build/objc-mcp
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-session-checkpoint language/objc/examples/session-checkpoint/session_checkpoint.m language/objc/src/PraxoJSON.m language/objc/src/PraxoJsonSchema.m language/objc/src/PraxoCore.m language/objc/src/PraxoAgent.m language/objc/src/PraxoHitl.m -framework Foundation
      - run: ./build/objc-session-checkpoint
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-hitl language/objc/examples/hitl/hitl.m language/objc/src/PraxoHitl.m language/objc/src/PraxoJSON.m language/objc/src/PraxoJsonSchema.m language/objc/src/PraxoCore.m language/objc/src/PraxoAgent.m -framework Foundation
      - run: ./build/objc-hitl

  examples-gate:
    needs: [changes, swift-examples, julia-examples, haskell-examples, ocaml-examples, nim-examples, v-examples, zig-examples, objc-examples]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check example job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS"])
          failed = [
              name
              for name, value in needs.items()
              if value["result"] in ("failure", "cancelled")
          ]
          if failed:
              raise SystemExit("failing jobs: " + ", ".join(failed))
          PY
