      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - run: php language/php/Tutorial/localization-draft/app.php --test

  php-lead-nurture:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'php')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - run: php language/php/Tutorial/lead-nurture/app.php --test

  php-tender-review:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'php')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - run: php language/php/Tutorial/tender-review/app.php --test

  php-copyright-evidence:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'php')
    runs-on: ubuntu-latest
    timeout-minutes: 10
