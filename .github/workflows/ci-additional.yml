name: ci-additional

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - "language/d/**"
      - "language/dart/**"
      - "language/delphi/**"
      - "language/perl/**"
      - ".github/workflows/ci-additional.yml"
      - "!scripts/check_adapter_status.py"
      - "!scripts/check_consumer_pins.py"
      - "!scripts/check_language_releases.py"
      - "!scripts/check_registry_pages.py"
      - "!scripts/check_registry_state.py"
      - "!scripts/docs_hooks.py"
      - "!scripts/mirror_readme.py"
      - "!scripts/registry_catalog.py"
      - "!scripts/registry_discovery.py"
      - "!scripts/repository_discovery.py"
      - "!scripts/sync_language_mirrors.py"
      - "!scripts/sync_language_registry_docs.py"
      - "!scripts/test_adapter_status.py"
      - "!scripts/test_consumer_pins.py"
      - "!scripts/test_discovery.py"
      - "!scripts/test_docs.py"
      - "!scripts/test_language_registry_docs.py"
      - "!scripts/test_language_releases.py"
      - "!scripts/test_layout.py"
      - "!scripts/test_registry_pages.py"
      - "!scripts/test_registry_state.py"
      - "!scripts/test_roadmap.py"
      - "!scripts/test_sync_language_mirrors.py"
      - "!scripts/behavior_lab.py"
      - "!scripts/check_ci_workflow_coverage.py"
      - "!scripts/ci_changes.py"
      - "!scripts/compatibility_lab.py"
      - "!scripts/cpp_behavior_suite.py"
      - "!scripts/sync_ci_routing.py"
      - "!scripts/test_behavior_lab.py"
      - "!scripts/test_ci_changes.py"
      - "!scripts/test_ci_execution.py"
      - "!scripts/test_compatibility_lab.py"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
      - "!scripts/build_php_package.py"
      - "!scripts/test_php_package.py"
  pull_request:
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - "language/d/**"
      - "language/dart/**"
      - "language/delphi/**"
      - "language/perl/**"
      - ".github/workflows/ci-additional.yml"
      - "!scripts/check_adapter_status.py"
      - "!scripts/check_consumer_pins.py"
      - "!scripts/check_language_releases.py"
      - "!scripts/check_registry_pages.py"
      - "!scripts/check_registry_state.py"
      - "!scripts/docs_hooks.py"
      - "!scripts/mirror_readme.py"
      - "!scripts/registry_catalog.py"
      - "!scripts/registry_discovery.py"
      - "!scripts/repository_discovery.py"
      - "!scripts/sync_language_mirrors.py"
      - "!scripts/sync_language_registry_docs.py"
      - "!scripts/test_adapter_status.py"
      - "!scripts/test_consumer_pins.py"
      - "!scripts/test_discovery.py"
      - "!scripts/test_docs.py"
      - "!scripts/test_language_registry_docs.py"
      - "!scripts/test_language_releases.py"
      - "!scripts/test_layout.py"
      - "!scripts/test_registry_pages.py"
      - "!scripts/test_registry_state.py"
      - "!scripts/test_roadmap.py"
      - "!scripts/test_sync_language_mirrors.py"
      - "!scripts/behavior_lab.py"
      - "!scripts/check_ci_workflow_coverage.py"
      - "!scripts/ci_changes.py"
      - "!scripts/compatibility_lab.py"
      - "!scripts/cpp_behavior_suite.py"
      - "!scripts/sync_ci_routing.py"
      - "!scripts/test_behavior_lab.py"
      - "!scripts/test_ci_changes.py"
      - "!scripts/test_ci_execution.py"
      - "!scripts/test_compatibility_lab.py"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
      - "!scripts/build_php_package.py"
      - "!scripts/test_php_package.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-additional.yml
        run: python scripts/ci_changes.py

  dart-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'dart')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart language/dart/examples/retry/retry.dart
      - run: dart language/dart/examples/checkpoint/checkpoint.dart
      - run: dart language/dart/examples/event-sink/event_sink.dart
      - run: dart language/dart/examples/provider-fallback/fallback.dart
      - run: dart language/dart/examples/structured-output/structured_output.dart
      - run: dart language/dart/examples/streaming/streaming.dart
      - run: dart language/dart/examples/identity-policy/identity_policy.dart
      - run: dart language/dart/examples/service/service.dart
      - run: dart language/dart/examples/mcp/mcp.dart
      - run: dart language/dart/examples/hitl/hitl.dart
      - run: dart language/dart/examples/hitl/hitl_test.dart
      - run: dart language/dart/examples/consumer/consumer.dart

  perl-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'perl')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: perl language/perl/examples/retry/retry.pl
      - run: perl language/perl/examples/checkpoint/checkpoint.pl
      - run: perl language/perl/examples/event-sink/event_sink.pl
      - run: perl language/perl/examples/provider-fallback/fallback.pl
      - run: perl language/perl/examples/structured-output/structured_output.pl
      - run: perl language/perl/examples/streaming/streaming.pl
      - run: perl language/perl/examples/identity-policy/identity_policy.pl
      - run: perl language/perl/examples/service/service.pl
      - run: perl language/perl/examples/mcp/mcp.pl
      - run: perl language/perl/examples/hitl/hitl.pl
      - run: perl language/perl/examples/hitl/test_hitl.pl
      - run: perl language/perl/examples/consumer/consumer.pl

  d-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'd')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/retry/retry.d
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/checkpoint/checkpoint.d
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/event-sink/event_sink.d
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/provider-fallback/fallback.d
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/structured-output/structured_output.d
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/streaming/streaming.d
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/identity-policy/identity_policy.d
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/service/service.d
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/mcp/mcp.d
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/hitl/starter.d
      - run: dmd -i -Ilanguage/d/source -Ilanguage/d/examples/hitl -version=HitlExampleTest -run language/d/examples/hitl/test_starter.d
      - run: dmd -i -Ilanguage/d/source -run language/d/examples/consumer/consumer.d

  delphi-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'delphi')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y fpc
      - run: mkdir -p build/delphi
      - run: fpc -Mobjfpc -Facwstring -Fulanguage/delphi -FEbuild/delphi language/delphi/examples/retry/retry.pas
      - run: ./build/delphi/retry
      - run: fpc -Mobjfpc -Facwstring -Fulanguage/delphi -FEbuild/delphi language/delphi/examples/checkpoint/checkpoint.pas
      - run: ./build/delphi/checkpoint
      - run: fpc -Mobjfpc -Facwstring -Fulanguage/delphi -FEbuild/delphi language/delphi/examples/event-sink/event_sink.pas
      - run: ./build/delphi/event_sink
      - run: fpc -Mobjfpc -Facwstring -Fulanguage/delphi -FEbuild/delphi language/delphi/examples/provider-fallback/fallback.pas
      - run: ./build/delphi/fallback
      - run: fpc -Mobjfpc -Facwstring -Fulanguage/delphi -FEbuild/delphi language/delphi/examples/structured-output/structured_output.pas
      - run: ./build/delphi/structured_output
      - run: fpc -Mobjfpc -Facwstring -Fulanguage/delphi -FEbuild/delphi language/delphi/examples/streaming/streaming.pas
      - run: ./build/delphi/streaming
      - run: fpc -Mobjfpc -Facwstring -Fulanguage/delphi -FEbuild/delphi language/delphi/examples/identity-policy/identity_policy.pas
      - run: ./build/delphi/identity_policy
      - run: fpc -Mobjfpc -Facwstring -Fulanguage/delphi -FEbuild/delphi language/delphi/examples/service/service.pas
      - run: ./build/delphi/service
      - run: fpc -Mobjfpc -Facwstring -Fulanguage/delphi -FEbuild/delphi language/delphi/examples/mcp/mcp.pas
      - run: ./build/delphi/mcp
      - run: fpc -Mobjfpc -Facwstring -Fulanguage/delphi -FEbuild/delphi language/delphi/examples/consumer/consumer.pas
      - run: ./build/delphi/consumer
      - run: fpc -Mobjfpc -Facwstring -Fulanguage/delphi -FEbuild/delphi language/delphi/examples/hitl/hitl.pas
      - run: ./build/delphi/hitl
      - run: fpc -Mobjfpc -Facwstring -Fulanguage/delphi -FEbuild/delphi language/delphi/examples/session-checkpoint/session_checkpoint.pas
      - run: ./build/delphi/session_checkpoint
