name: ci-tutorial-delphi

on:
  push:
    branches: [main]
    paths:
      - "language/delphi/Tutorial/**"
      - ".github/workflows/ci-tutorial-delphi.yml"
  pull_request:
    paths:
      - "language/delphi/Tutorial/**"
      - ".github/workflows/ci-tutorial-delphi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-tutorial-delphi.yml
        run: python -m scripts.ci.ci_changes

  delphi-legacy-migration:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'delphi')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fpc
      - run: mkdir -p language/delphi/build
      - run: fpc -Mobjfpc -Scghi -O2 -Fu. -FEbuild Tutorial/legacy-migration/inventory.pas
        working-directory: language/delphi
      - run: ./build/inventory --test
        working-directory: language/delphi

  delphi-rpa-reconciliation:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'delphi')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fpc
      - run: mkdir -p language/delphi/build
      - run: fpc -Mobjfpc -Scghi -O2 -Fu. -FEbuild Tutorial/rpa-reconciliation/reconcile.pas
        working-directory: language/delphi
      - run: ./build/reconcile --test
        working-directory: language/delphi

  delphi-tax-review:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'delphi')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fpc
      - run: mkdir -p language/delphi/build
      - run: fpc -Mobjfpc -Scghi -O2 -Fu. -FEbuild Tutorial/tax-review/tax.pas
        working-directory: language/delphi
      - run: ./build/tax --test
        working-directory: language/delphi

  delphi-hvac-settings:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'delphi')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fpc
      - run: mkdir -p language/delphi/build
      - run: fpc -Mobjfpc -Scghi -O2 -Fu. -FEbuild Tutorial/hvac-settings/hvac.pas
        working-directory: language/delphi
      - run: ./build/hvac --test
        working-directory: language/delphi

