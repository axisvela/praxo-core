name: ci-tutorial-c

on:
  push:
    branches: [main]
    paths:
      - "language/c/Tutorial/**"
      - ".github/workflows/ci-tutorial-c.yml"
  pull_request:
    paths:
      - "language/c/Tutorial/**"
      - ".github/workflows/ci-tutorial-c.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-tutorial-c.yml
        run: python -m scripts.ci.ci_changes

  c-new-tutorials:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'c')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        tutorial: [lab-loop, npc-narrative, world-economy, hvac-settings, livestock-monitor, aquaculture-water]
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p build
      - run: cmake -S language/c -B language/c/build && cmake --build language/c/build
      - run: cc -std=c11 -Ilanguage/c/include language/c/Tutorial/${{ matrix.tutorial }}/main.c -Llanguage/c/build -lpraxo_core -lm -o build/${{ matrix.tutorial }}
      - run: ./build/${{ matrix.tutorial }} --test

  c-device-diagnostics:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'c')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S language/c -B language/c/build
      - run: cmake --build language/c/build --target praxo-c-device-diagnostics-tutorial
      - run: ./language/c/build/praxo-c-device-diagnostics-tutorial --test

