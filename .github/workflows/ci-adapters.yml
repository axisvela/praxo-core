name: ci-adapters

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - ".github/workflows/ci-adapters.yml"
      - "!scripts/discovery/**"
      - "!scripts/checks/**"
      - "!scripts/release/**"
      - "!scripts/execution/**"
      - "!scripts/validation/**"
      - "!scripts/ci/**"
      - "!scripts/labs/**"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
      - "!scripts/consumers/go/**"
      - "!scripts/consumers/java/**"
      - "!scripts/consumers/longrunning/**"
      - "!scripts/consumers/python/**"
      - "!scripts/consumers/typescript/**"
      - "!scripts/languages/ocaml/**"
      - "!scripts/languages/php/**"
  pull_request:
    paths:
      - "spec/**"
      - "scripts/**"
      - "pkg/**"
      - "internal/**"
      - "cmd/**"
      - "bindings/**"
      - "adapters/**"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Makefile"
      - ".github/actions/**"
      - ".github/workflows/ci-adapters.yml"
      - "!scripts/discovery/**"
      - "!scripts/checks/**"
      - "!scripts/release/**"
      - "!scripts/execution/**"
      - "!scripts/validation/**"
      - "!scripts/ci/**"
      - "!scripts/labs/**"
      - "!language/discovery.json"
      - "!language/registry-metadata.json"
      - "!spec/languages.md"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/*/application/**"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
      - "!scripts/consumers/go/**"
      - "!scripts/consumers/java/**"
      - "!scripts/consumers/longrunning/**"
      - "!scripts/consumers/python/**"
      - "!scripts/consumers/typescript/**"
      - "!scripts/languages/ocaml/**"
      - "!scripts/languages/php/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-adapters.yml
        run: python -m scripts.ci.ci_changes

  adapters:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: go test ./...
        working-directory: adapters/mcp
      - run: go vet ./...
        working-directory: adapters/mcp
      - run: go build ./...
        working-directory: adapters/mcp
      - run: go test ./...
        working-directory: adapters/otel
      - run: go vet ./...
        working-directory: adapters/otel
      - run: go build ./...
        working-directory: adapters/otel
      - run: go test ./...
        working-directory: adapters/anthropic
      - run: go vet ./...
        working-directory: adapters/anthropic
      - run: go build ./...
        working-directory: adapters/anthropic
      - run: go test ./...
        working-directory: adapters/gemini
      - run: go vet ./...
        working-directory: adapters/gemini
      - run: go build ./...
        working-directory: adapters/gemini
      - run: go test ./...
        working-directory: adapters/harmovela
      - run: go vet ./...
        working-directory: adapters/harmovela
      - run: go build ./...
        working-directory: adapters/harmovela
      - run: go test ./...
        working-directory: adapters/a2a
      - run: go vet ./...
        working-directory: adapters/a2a
      - run: go build ./...
        working-directory: adapters/a2a
      - run: go test ./...
        working-directory: adapters/multiagent
      - run: go vet ./...
        working-directory: adapters/multiagent
      - run: go build ./...
        working-directory: adapters/multiagent
      - run: go test ./...
        working-directory: adapters/workspace
      - run: go vet ./...
        working-directory: adapters/workspace
      - run: go build ./...
        working-directory: adapters/workspace
      - run: go test ./...
        working-directory: adapters/workspace/e2b
      - run: go vet ./...
        working-directory: adapters/workspace/e2b
      - run: go build ./...
        working-directory: adapters/workspace/e2b
      - run: go test ./...
        working-directory: adapters/workspace/daytona
      - run: go vet ./...
        working-directory: adapters/workspace/daytona
      - run: go build ./...
        working-directory: adapters/workspace/daytona
      - run: go test ./...
        working-directory: adapters/workspace/opensandbox
      - run: go vet ./...
        working-directory: adapters/workspace/opensandbox
      - run: go build ./...
        working-directory: adapters/workspace/opensandbox
      - run: go test ./...
        working-directory: adapters/workspace/cubesandbox
      - run: go vet ./...
        working-directory: adapters/workspace/cubesandbox
      - run: go build ./...
        working-directory: adapters/workspace/cubesandbox

  module-security-adapters:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        module:
          - adapters/mcp
          - adapters/otel
          - adapters/anthropic
          - adapters/gemini
          - adapters/harmovela
          - adapters/a2a
          - adapters/multiagent
          - adapters/workspace
          - adapters/workspace/e2b
          - adapters/workspace/daytona
          - adapters/workspace/opensandbox
          - adapters/workspace/cubesandbox
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go test -race -mod=readonly ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
