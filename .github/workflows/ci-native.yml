      - "!scripts/test_ocaml_package.py"
      - "!scripts/test_php_package.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-native.yml
        run: python scripts/ci_changes.py

  c-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'c')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language/c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check C public API snapshot
        run: python api-snapshot.py --check
      - run: cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/praxo-c"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - name: Install C package and run consumer
        run: |
          cmake --install build
          library="$(find "$RUNNER_TEMP/praxo-c" -name libpraxo_core.a -print -quit)"
          test -n "$library"
          cc -std=c11 -I"$RUNNER_TEMP/praxo-c/include" tests/install_consumer.c \
            "$library" -lm -o "$RUNNER_TEMP/praxo-c-consumer"
          "$RUNNER_TEMP/praxo-c-consumer"

  cpp-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'c') || contains(fromJSON(needs.changes.outputs.languages), 'cpp')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S language/cpp -B language/cpp/build
      - run: cmake --build language/cpp/build
      - run: ctest --test-dir language/cpp/build --output-on-failure
      - name: Verify installed C++ consumer
        run: |
          cmake --install language/cpp/build --prefix "$RUNNER_TEMP/praxo-cpp"
          cmake -S language/cpp/examples/consumer -B "$RUNNER_TEMP/praxo-cpp-consumer" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/praxo-cpp"
          cmake --build "$RUNNER_TEMP/praxo-cpp-consumer"
          "$RUNNER_TEMP/praxo-cpp-consumer/praxo-cpp-installed-consumer"
      - run: python3 language/cpp/api-snapshot.py --check
      - run: cmake -S language/c -B language/c/build
      - run: cmake --build language/c/build
      - run: g++ -std=c++20 -O2 -I language/cpp/include language/cpp/tests/plugin_process.cpp -L language/c/build -lpraxo_core -o language/cpp/build/praxo-cpp-plugin-process
      - run: ./language/cpp/build/praxo-cpp-plugin-process

  fortran-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'c') || contains(fromJSON(needs.changes.outputs.languages), 'fortran')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install -y gfortran g++ cmake ninja-build
      - run: python3 language/fortran/run-tests.py
      - run: cmake -S language/c -B language/c/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build language/c/build --target praxo_core
      - name: Fortran process plugin host
        env:
          PYTHON: python3
        run: |
          cd language/fortran
          mkdir -p build
          gfortran -c -J build -o build/praxo_plugin_process.o src/praxo_plugin_process.f90
          gfortran -static -J build -I build tests/plugin_process.f90 build/praxo_plugin_process.o ../c/build/libpraxo_core.a -lm -o build/plugin_process_tests
          ./build/plugin_process_tests

  cobol-conformance:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'cobol')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install -y gnucobol
      - run: python3 language/cobol/run-tests.py
      - run: python3 language/cobol/examples/batch-exception-review/run.py
      - run: python3 language/cobol/tests/run_plugin_process.py

  opencl-sample:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'c') || contains(fromJSON(needs.changes.outputs.languages), 'opencl')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd
      - run: mkdir -p build
      - run: cc -std=c11 -DCL_TARGET_OPENCL_VERSION=300 -I language/c/include -I language/c/src language/opencl/examples/sample.c language/c/src/json.c -lOpenCL -lm -o build/opencl-sample
      - run: ./build/opencl-sample
