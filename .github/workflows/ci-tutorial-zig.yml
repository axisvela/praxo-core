name: ci-tutorial-zig

on:
  push:
    branches: [main]
    paths:
      - "language/zig/Tutorial/**"
      - ".github/workflows/ci-tutorial-zig.yml"
  pull_request:
    paths:
      - "language/zig/Tutorial/**"
      - ".github/workflows/ci-tutorial-zig.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-tutorial-zig.yml
        run: python -m scripts.ci.ci_changes

  zig-gateway-health:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'zig')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"
      - run: mkdir -p build
      - run: zig build-exe --dep praxo -Mroot=language/zig/Tutorial/gateway-health/main.zig -Mpraxo=language/zig/src/praxo.zig -femit-bin=build/praxo-zig-gateway
      - run: ./build/praxo-zig-gateway --test

  zig-drone-fleet-plan:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.tutorials), 'zig')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"
      - run: mkdir -p build
      - run: zig build-exe --dep praxo -Mroot=language/zig/Tutorial/drone-fleet-plan/main.zig -Mpraxo=language/zig/src/praxo.zig -femit-bin=build/praxo-zig-drone-fleet
      - run: ./build/praxo-zig-drone-fleet --test

