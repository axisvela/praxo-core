name: ci-examples-objc

on:
  push:
    branches: [main]
    paths:
      - "language/objc/**"
      - ".github/workflows/ci-examples-objc.yml"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
  pull_request:
    paths:
      - "language/objc/**"
      - ".github/workflows/ci-examples-objc.yml"
      - "!language/**/AGENTS.md"
      - "!language/**/CONTRIBUTING.md"
      - "!language/**/LICENSE.md"
      - "!language/**/PUBLISHING.md"
      - "!language/**/README.md"
      - "!language/**/README.pod"
      - "!language/**/README.zh-CN.md"
      - "!language/**/REGISTRY.md"
      - "!language/**/SECURITY.md"
      - "!language/**/llms.md"
      - "!language/**/llms.txt"
      - "!language/**/README*.md"
      - "!language/**/CHANGELOG*.md"
      - "!language/**/docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      examples: ${{ steps.filter.outputs.examples }}
      consumers: ${{ steps.filter.outputs.consumers }}
      adapters: ${{ steps.filter.outputs.adapters }}
      languages: ${{ steps.filter.outputs.languages }}
      applications: ${{ steps.filter.outputs.applications }}
      tutorials: ${{ steps.filter.outputs.tutorials }}
      example_languages: ${{ steps.filter.outputs.example_languages }}
      labs: ${{ steps.filter.outputs.labs }}
      compatibility_languages: ${{ steps.filter.outputs.compatibility_languages }}
      behavior_languages: ${{ steps.filter.outputs.behavior_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          WORKFLOW_FILE: .github/workflows/ci-examples-objc.yml
        run: python -m scripts.ci.ci_changes

  objc-examples:
    needs: changes
    if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.languages), 'objc')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p build
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-retry language/objc/examples/retry/retry.m -framework Foundation
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'objc')
      - run: ./build/objc-retry
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-checkpoint language/objc/examples/checkpoint/checkpoint.m language/objc/src/PraxoCore.m language/objc/src/PraxoJSON.m -framework Foundation
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'objc')
      - run: ./build/objc-checkpoint
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-event-sink language/objc/examples/event-sink/event_sink.m language/objc/src/PraxoCore.m language/objc/src/PraxoJSON.m -framework Foundation
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'objc')
      - run: ./build/objc-event-sink
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-provider-fallback language/objc/examples/provider-fallback/fallback.m -framework Foundation
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'objc')
      - run: ./build/objc-provider-fallback
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-structured-output language/objc/examples/structured-output/structured_output.m language/objc/src/PraxoJsonSchema.m language/objc/src/PraxoJSON.m -framework Foundation
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'objc')
      - run: ./build/objc-structured-output
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-streaming language/objc/examples/streaming/streaming.m -framework Foundation
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'objc')
      - run: ./build/objc-streaming
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-identity-policy language/objc/examples/identity-policy/identity_policy.m -framework Foundation
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'objc')
      - run: ./build/objc-identity-policy
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-service language/objc/examples/service/service.m -framework Foundation
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'objc')
      - run: ./build/objc-service
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-mcp language/objc/examples/mcp/mcp.m language/objc/src/PraxoMCP.m language/objc/src/PraxoCore.m language/objc/src/PraxoJSON.m -framework Foundation
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'objc')
      - run: ./build/objc-mcp
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-session-checkpoint language/objc/examples/session-checkpoint/session_checkpoint.m language/objc/src/PraxoJSON.m language/objc/src/PraxoJsonSchema.m language/objc/src/PraxoCore.m language/objc/src/PraxoAgent.m language/objc/src/PraxoHitl.m -framework Foundation
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'objc')
      - run: ./build/objc-session-checkpoint
      - run: clang -fobjc-arc -fblocks -Ilanguage/objc/src -o build/objc-hitl language/objc/examples/hitl/hitl.m language/objc/src/PraxoHitl.m language/objc/src/PraxoJSON.m language/objc/src/PraxoJsonSchema.m language/objc/src/PraxoCore.m language/objc/src/PraxoAgent.m -framework Foundation
        if: needs.changes.outputs.full == 'true' || contains(fromJSON(needs.changes.outputs.example_languages), 'objc')
      - run: ./build/objc-hitl

