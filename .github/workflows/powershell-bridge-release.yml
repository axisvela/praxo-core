name: powershell-bridge-release

on:
  push:
    tags:
      - "powershell-br/v*"
  workflow_dispatch:
    inputs:
      target:
        description: Publish target
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - publish

permissions:
  contents: read

concurrency:
  group: powershell-bridge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: Verify manifest version and tag
        shell: pwsh
        run: |
          $manifest = Import-PowerShellDataFile ./bindings/powershell/praxo-core-ps-br/praxo-core-ps-br.psd1
          $version = $manifest.ModuleVersion
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ("powershell-br/v$version" -ne $env:GITHUB_REF_NAME) {
              throw "manifest version does not match tag"
            }
          }
      - name: Build bridge binaries
        shell: bash
        run: |
          mkdir -p bindings/powershell/praxo-core-ps-br/bin/linux-x64
          mkdir -p bindings/powershell/praxo-core-ps-br/bin/linux-arm64
          mkdir -p bindings/powershell/praxo-core-ps-br/bin/win-x64
          mkdir -p bindings/powershell/praxo-core-ps-br/bin/osx-x64
          mkdir -p bindings/powershell/praxo-core-ps-br/bin/osx-arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bindings/powershell/praxo-core-ps-br/bin/linux-x64/praxo-bridge ./cmd/praxo-bridge
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bindings/powershell/praxo-core-ps-br/bin/linux-arm64/praxo-bridge ./cmd/praxo-bridge
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bindings/powershell/praxo-core-ps-br/bin/win-x64/praxo-bridge.exe ./cmd/praxo-bridge
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bindings/powershell/praxo-core-ps-br/bin/osx-x64/praxo-bridge ./cmd/praxo-bridge
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bindings/powershell/praxo-core-ps-br/bin/osx-arm64/praxo-bridge ./cmd/praxo-bridge
      - name: Validate bundled bridge
        shell: pwsh
        run: |
          Import-Module ./bindings/powershell/praxo-core-ps-br/praxo-core-ps-br.psm1 -Force
          Invoke-PraxoBridge -Arguments @('version')
      - uses: actions/upload-artifact@v4
        with:
          name: powershell-bridge-module
          path: bindings/powershell/praxo-core-ps-br
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'publish')
    runs-on: ubuntu-latest
    environment:
      name: powershell-gallery
      url: https://www.powershellgallery.com/packages/praxo-core-ps-br
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: powershell-bridge-module
          path: module/praxo-core-ps-br
      - name: Check published version
        id: registry
        shell: pwsh
        run: |
          $manifest = Import-PowerShellDataFile ./module/praxo-core-ps-br/praxo-core-ps-br.psd1
          $version = $manifest.ModuleVersion
          $published = Find-Module -Name praxo-core-ps-br -Repository PSGallery -ErrorAction SilentlyContinue
          if ($published -and $published.Version.ToString() -eq $version) {
            "already_published=true" >> $env:GITHUB_OUTPUT
            "praxo-core-ps-br@$version is already published; skipping publish"
          } else {
            "already_published=false" >> $env:GITHUB_OUTPUT
          }
      - name: Publish to PowerShell Gallery
        if: steps.registry.outputs.already_published != 'true'
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw "PSGALLERY_API_KEY is not configured" }
          Publish-Module -Path ./module/praxo-core-ps-br -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY
