site_name: PRAXO-CORE
site_description: An embeddable MIT-licensed agent framework with explicit policy controls, checkpoints, and event tracing.
site_url: https://axisvela.github.io/praxo-core/
repo_url: https://github.com/axisvela/praxo-core
repo_name: axisvela/praxo-core
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh-CN
          name: 简体中文
          build: true
          theme:
            language: zh
          nav_translations:
            Home: 首页
            Getting Started: 开始使用
            Start Here: 阅读导览
            Overview: 概览
            Quickstart: 快速开始
            Adoption: 采用指南
            When Not to Use: 何时不应选择
            Guides: 使用指南
            Integration: 集成
            Recipes: 接入示例
            Multi-Agent: 多 Agent 模式
            Plugins: 插件编写
            Language Implementations: 语言实现
            Implementation Directory: 实现目录
            Language Matrix: 语言总表
            Support Policy: 支持政策
            Compatibility Lab: 兼容性实验
            Integrations: 适配与生态
            Adapter Directory: 适配器目录
            Ecosystem: 生态集成
            Reference: 技术参考
            Architecture: 架构
            Primitives: 基础能力
            Events: 事件
            Workspace and Session: 工作区与会话
            Governed Execution: 受治理执行
            Security: 安全
            Security Model: 安全模型
            Containment: 路径隔离
            Plugin Trust: 插件信任
            Project: 项目信息
            Compatibility: 兼容性
            Compatibility Policy: 兼容政策
            API Stability: API 稳定性
            v2 Migration: v2 迁移
            Comparison: 框架对比
            Benchmarks: 基准测试
            Roadmap: 公开路线图
            Verification Evidence: 验证证据
            License and Provenance: 许可证与来源
            Repository Layout: 仓库布局
            Contributing: 参与贡献
            Core Design: Core 设计
            Language Policy: 语言支持规范
            Test Evidence: 测试证据
            Releases: 版本发布
            Release Overview: 版本总览
            Latest Release: 最新版本
            Release Process: 发布规范
  - redirects:
      redirect_maps: {}

hooks:
  - scripts/docs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started:
      - Start Here: getting-started/index.md
      - Overview: getting-started/overview.md
      - Quickstart: getting-started/quickstart.md
