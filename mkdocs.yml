site_name: PRAXO-CORE
site_description: A public, MIT-licensed agent framework for the AxisVela ecosystem.
site_url: https://axisvela.github.io/praxo-core/
repo_url: https://github.com/axisvela/praxo-core
repo_name: axisvela/praxo-core

docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

