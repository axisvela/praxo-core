site_name: PRAXO-CORE
site_description: An embeddable MIT-licensed agent framework with explicit policy controls, checkpoints, and event tracing.
site_url: https://axisvela.github.io/praxo-core/
repo_url: https://github.com/axisvela/praxo-core
repo_name: axisvela/praxo-core
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh-CN
          name: 简体中文
          build: true
          theme:
            language: zh
          nav_translations:
            Home: 首页
            Getting Started: 开始使用
            Start Here: 阅读导览
            Overview: 概览
            Quickstart: 快速开始
            Adoption: 采用指南
            Guides: 使用指南
            Integration: 集成
            Recipes: 接入示例
            Multi-Agent: 多 Agent 模式
            Plugins: 插件编写
            Language SDKs: 语言 SDK
            SDK Directory: SDK 目录
            Support Policy: 支持政策
            Integrations: 适配与生态
            Adapter Directory: 适配器目录
            Ecosystem: 生态集成
            Reference: 技术参考
            Architecture: 架构
            Primitives: 基础能力
            Events: 事件
            Workspace and Session: 工作区与会话
            Security: 安全
            Security Model: 安全模型
            Containment: 路径隔离
            Plugin Trust: 插件信任
            Project: 项目信息
            Compatibility: 兼容性
            Compatibility Policy: 兼容政策
            API Stability: API 稳定性
            v2 Migration: v2 迁移
            Comparison: 框架对比
            Benchmarks: 基准测试
            Roadmap: 公开路线图
            License and Provenance: 许可证与来源
            Contributing: 参与贡献
            SDK Design: SDK 设计
            Language Policy: 语言支持规范
            Releases: 版本发布
            Release Overview: 版本总览
            Latest Release: 最新版本
            Release Process: 发布规范
  - redirects:
      redirect_maps: {}

hooks:
  - scripts/docs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started:
      - Start Here: getting-started/index.md
      - Overview: getting-started/overview.md
      - Quickstart: getting-started/quickstart.md
      - Adoption: getting-started/adoption.md
  - Guides:
      - Integration: guides/integration.md
      - Recipes: guides/recipes.md
      - Multi-Agent: guides/multi-agent.md
      - Plugins: guides/plugins.md
  - Language SDKs:
      - SDK Directory: sdks/index.md
      - Support Policy: sdks/support.md
      - Go: sdks/go.md
      - Python: sdks/python.md
      - TypeScript: sdks/typescript.md
      - JavaScript: sdks/javascript.md
      - Java: sdks/java.md
      - Kotlin: sdks/kotlin.md
      - Scala: sdks/scala.md
      - Rust: sdks/rust.md
      - C: sdks/c.md
      - C++: sdks/cpp.md
      - C# / .NET: sdks/csharp.md
      - Visual Basic: sdks/visual-basic.md
      - PHP: sdks/php.md
      - Ruby: sdks/ruby.md
      - Perl: sdks/perl.md
      - Lua: sdks/lua.md
      - Dart: sdks/dart.md
      - Swift: sdks/swift.md
      - Julia: sdks/julia.md
      - R: sdks/r.md
      - D: sdks/d.md
      - Zig: sdks/zig.md
      - COBOL: sdks/cobol.md
      - Fortran: sdks/fortran.md
      - Shell: sdks/shell.md
      - PowerShell: sdks/powershell.md
  - Integrations:
      - Adapter Directory: integrations/index.md
      - Ecosystem: integrations/ecosystem.md
  - Reference:
      - Architecture: reference/architecture.md
      - Primitives: reference/primitives.md
      - Events: reference/events.md
      - Workspace and Session: reference/workspace-session.md
  - Security:
      - Security Model: security/index.md
      - Containment: security/containment.md
      - Plugin Trust: security/plugin-trust.md
  - Project:
      - Compatibility: project/compatibility.md
      - Compatibility Policy: project/compatibility-policy.md
      - API Stability: project/api-stability.md
      - v2 Migration: project/migration-v2.md
      - Comparison: project/comparison.md
      - Benchmarks: project/benchmarks.md
      - Roadmap: project/roadmap.md
      - License and Provenance: project/provenance.md
  - Contributing:
      - SDK Design: contributing/sdk-design.md
      - Language Policy: contributing/language-policy.md
  - Releases:
      - Release Overview: releases/index.md
      - Latest Release: releases/2.5.0.md
      - Release Process: project/releasing.md
