[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praxo-core"
version = "0.2.0"
description = "Python SDK for the PRAXO-CORE agent contract"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AxisVela" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/axisvela/praxo-core"
Documentation = "https://axisvela.github.io/praxo-core/17-multilingual-sdk/"
Source = "https://github.com/axisvela/praxo-core/tree/main/python"

[tool.setuptools.packages.find]
where = ["."]
include = ["praxo*"]
