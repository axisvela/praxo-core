[package]
name = "praxo-core"
version = "0.11.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "PRAXO-CORE (praxocore): embeddable native Rust AI agent framework with tool calling, policy hooks, approvals, checkpoints, and events"
repository = "https://github.com/axisvela/praxo-core"
homepage = "https://axisvela.github.io/praxo-core/"
documentation = "https://docs.rs/praxo-core"
readme = "README.md"
keywords = ["praxocore", "agent-framework", "llm", "tool-calling", "human-in-the-loop"]
categories = ["development-tools", "api-bindings"]
include = ["src/**", "Cargo.toml", "README.md", "REGISTRY.md", "llms.txt", "llms.md", "LICENSE"]

[features]
default = []
http-ureq = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = { version = "2.12", optional = true, default-features = false, features = ["native-tls", "json"] }

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"
